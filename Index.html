<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ASCII Battle Royale - Alpha v0.25</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    /* HUD Panels */
    #stats-panel {
      position: fixed; top: 20px; left: 20px;
      background: rgba(0,0,0,0.9);
      padding: 14px;
      border: 2px solid #0f0;
      font-size: 11px;
      z-index: 1000;
      min-width: 200px;
      color: #888;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0,255,0,0.3);
    }
    #stats-panel h3 {
      color: #0f0;
      margin-bottom: 10px;
      font-size: 14px;
      text-shadow: 0 0 8px #0f0;
      letter-spacing: 2px;
    }
    .stat-row { 
      margin: 5px 0; 
      display: flex; 
      justify-content: space-between;
      padding: 2px 0;
    }
    .stat-value { 
      color: #0ff; 
      font-weight: bold;
      text-shadow: 0 0 5px #0ff;
    }

    #leaderboard {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.9);
      padding: 14px;
      border: 2px solid #ff0;
      font-size: 11px;
      z-index: 1000;
      min-width: 220px;
      max-height: 320px;
      overflow-y: auto;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(255,255,0,0.3);
    }
    #leaderboard h3 {
      color: #ff0;
      margin-bottom: 10px;
      font-size: 14px;
      text-shadow: 0 0 8px #ff0;
      letter-spacing: 2px;
    }
    .leader-entry { 
      color: #888; 
      margin: 4px 0; 
      display: flex; 
      justify-content: space-between;
      padding: 3px 6px;
      border-radius: 3px;
    }
    .leader-name { color: #0ff; }
    .leader-score { color: #f80; font-weight: bold; }

    #chat-retainer {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.9);
      padding: 12px;
      border: 2px solid #0f0;
      max-width: 380px;
      z-index: 999;
      max-height: 140px;
      overflow-y: auto;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0,255,0,0.3);
    }
    #chat-retainer h4 {
      color: #0f0;
      margin-bottom: 6px;
      font-size: 12px;
      text-shadow: 0 0 8px #0f0;
      letter-spacing: 1px;
    }
    .chat-line { 
      color: #888; 
      margin: 4px 0; 
      font-size: 10px; 
      word-wrap: break-word;
      padding: 2px 4px;
      border-left: 2px solid #0f0;
      padding-left: 8px;
    }

    #connection-status {
      position: fixed;
      top: 20px; right: 20px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.9);
      border: 2px solid #888;
      font-size: 11px;
      z-index: 1000;
      color: #888;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #connection-status.connected {
      color: #0f0;
      border-color: #0f0;
      text-shadow: 0 0 8px #0f0;
      box-shadow: 0 0 15px rgba(0,255,0,0.3);
    }
    #connection-status.test-mode {
      color: #fa0;
      border-color: #fa0;
      text-shadow: 0 0 8px #fa0;
      animation: pulse-warning 2s infinite;
    }
    @keyframes pulse-warning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Boss Alert */
    #boss-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      padding: 30px 50px;
      border: 4px solid #f00;
      font-size: 32px;
      z-index: 2000;
      color: #f00;
      text-shadow: 0 0 20px #f00;
      border-radius: 10px;
      display: none;
      animation: boss-flash 0.5s infinite;
      font-weight: bold;
      letter-spacing: 4px;
    }
    @keyframes boss-flash {
      0%, 100% { opacity: 1; border-color: #f00; }
      50% { opacity: 0.7; border-color: #ff0; }
    }

    /* Entities */
    .entity {
      position: absolute;
      font-size: 16px;
      white-space: pre;
      pointer-events: none;
      line-height: 1.2;
      font-weight: bold;
      text-shadow: 0 0 5px currentColor;
      z-index: 100;
    }
    .entity.boss {
      font-size: 28px;
      z-index: 200;
      animation: boss-glow 1s infinite;
    }
    @keyframes boss-glow {
      0%, 100% { text-shadow: 0 0 10px #f00, 0 0 20px #f00; }
      50% { text-shadow: 0 0 20px #f00, 0 0 30px #f00; }
    }

    .projectile {
      position: absolute;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      font-weight: bold;
      z-index: 150;
    }
    .projectile.laser {
      animation: laser-pulse 0.3s infinite;
      font-size: 14px;
    }
    @keyframes laser-pulse {
      0%, 100% { opacity: 1; transform: scale(1) translateX(0); }
      50% { opacity: 0.9; transform: scale(1.1) translateX(2px); }
    }

    .pickup {
      position: absolute;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 8px currentColor;
      animation: float-pickup 3s ease-in-out infinite;
      z-index: 90;
      font-weight: bold;
    }
    @keyframes float-pickup {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-6px); }
    }

    .damage-number {
      position: absolute;
      font-size: 14px;
      font-weight: bold;
      animation: fade-up 1.8s ease-out forwards;
      pointer-events: none;
      text-shadow: 0 0 8px currentColor;
      z-index: 300;
    }
    @keyframes fade-up {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
    .damage-number.crit {
      font-size: 18px;
      animation: crit-pop 1.8s ease-out forwards;
    }
    @keyframes crit-pop {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      20% { transform: translateY(-5px) scale(1.3); }
      100% { transform: translateY(-35px) scale(1); opacity: 0; }
    }

    /* KOTH Zone */
    .koth-zone {
      position: absolute;
      border: 3px dashed #ff0;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.3;
      animation: zone-pulse 3s ease-in-out infinite;
      z-index: 50;
      box-shadow: 0 0 20px rgba(255,255,0,0.4);
    }
    @keyframes zone-pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.05); }
    }
    .koth-label {
      position: absolute;
      color: #ff0;
      font-size: 10px;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0;
      pointer-events: none;
      z-index: 51;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Scrollbar */
    #leaderboard::-webkit-scrollbar, #chat-retainer::-webkit-scrollbar {
      width: 6px;
    }
    #leaderboard::-webkit-scrollbar-track, #chat-retainer::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.3);
    }
    #leaderboard::-webkit-scrollbar-thumb {
      background: #ff0;
      border-radius: 3px;
    }
    #chat-retainer::-webkit-scrollbar-thumb {
      background: #0f0;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="stats-panel">
    <h3>⚔ BATTLE STATS</h3>
    <div class="stat-row"><span>Players:</span><span class="stat-value" id="player-count">0</span></div>
    <div class="stat-row"><span>AI Enemies:</span><span class="stat-value" id="ai-count">0</span></div>
    <div class="stat-row"><span>Active:</span><span class="stat-value" id="total-fighters">0</span></div>
    <div class="stat-row"><span>Pickups:</span><span class="stat-value" id="ammo-count">0</span></div>
    <div class="stat-row"><span>Defeated:</span><span class="stat-value" id="kill-count">0</span></div>
    <div class="stat-row"><span>Runtime:</span><span class="stat-value" id="runtime">0:00</span></div>
    <div class="stat-row"><span>FPS:</span><span class="stat-value" id="fps">60</span></div>
  </div>

  <div id="leaderboard"><h3>★ TOP FIGHTERS</h3></div>
  <div id="connection-status">CONNECTING...</div>
  
  <div id="chat-retainer">
    <h4>💬 CHAT</h4>
  </div>

  <div id="boss-alert">⚠ BOSS SPAWNED ⚠</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════════
    // ASCII BATTLE ROYALE - ALPHA v0.25
    // ═══════════════════════════════════════════════════════════════
    console.log('═'.repeat(60));
    console.log('ASCII BATTLE ROYALE - ALPHA v0.25');
    console.log('Build: 2025-10-12 | Streamlabs Integration + Advanced Combat');
    console.log('═'.repeat(60));

    // ═══════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════
    const CONFIG = {
      // Streamlabs Integration
      STREAMLABS_SOCKET_TOKEN: '',        // SET YOUR TOKEN HERE
      TEST_MODE: true,                    // Auto-enables if token is empty
      
      // Gameplay Pacing in milliseconds
      AI_SPAWN_INTERVAL: 15000,
      BOSS_SPAWN_INTERVAL: 120000,
      PICKUP_SPAWN_INTERVAL: 10000,
      KOTH_RELOCATE_INTERVAL: 30000,
      
      // Combat
      COLLISION_RADIUS: 35,               // Larger hitbox for fighters
      KNOCKBACK_STRENGTH: 30,
      CRIT_CHANCE: 0.15,
      CRIT_MULTIPLIER: 2.0,
      HEALTH_DECAY_RATE: 0.04,
      PROJECTILE_LIFETIME: 6.0,
      
      // Progression
      XP_CURVE: [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200],
      XP_PER_KILL: 50,
      XP_PER_AI_KILL: 30,
      XP_PER_BOSS: 200,
      KOTH_XP_PER_SEC: 3,
      KOTH_HEAL_PER_SEC: 2,
      
      // NEZ (No Entry Zone) - Center OBS safe zone
      NEZ_ENABLED: true,
      NEZ_X: 640,
      NEZ_Y: 340,
      NEZ_WIDTH: 720,
      NEZ_HEIGHT: 400,
      NEZ_REPEL_FORCE: 400,               // Strong repulsion
      NEZ_FEAR_DISTANCE: 200,             // AI avoids within 100px of NEZ
      
      // KOTH
      KOTH_ZONE_RADIUS: 100,
      
      // Limits
      MAX_FIGHTERS: 100,
      MAX_PICKUPS: 150,
      MAX_PROJECTILES: 200,
      FPS_UPDATE_INTERVAL: 500,
      
      // Visual
      DAMAGE_NUMBER_DURATION: 1800,
      BOSS_ALERT_DURATION: 3000,
    };

    console.log('Config loaded. Test mode:', CONFIG.TEST_MODE || !CONFIG.STREAMLABS_SOCKET_TOKEN);

    // ═══════════════════════════════════════════════════════════════
    // WEAPONS SYSTEM
    // ═══════════════════════════════════════════════════════════════
    const WEAPONS = {
      // Standard Weapons
      pistol:   { projectile: "•",  damage: 10, speed: 150, color: "#f88", mag: 8,  reload: 1.5, accuracy: 0.85, fireRate: 0.4 },
      rifle:    { projectile: "━",  damage: 15, speed: 180, color: "#ff0", mag: 30, reload: 2.0, accuracy: 0.70, fireRate: 0.15 },
      smg:      { projectile: "·",  damage: 8,  speed: 160, color: "#8f8", mag: 25, reload: 1.8, accuracy: 0.60, fireRate: 0.1 },
      staff:    { projectile: "✦",  damage: 18, speed: 100, color: "#88f", mag: 10, reload: 2.5, accuracy: 0.90, fireRate: 0.8 },
      bow:      { projectile: "→",  damage: 14, speed: 140, color: "#af8", mag: 12, reload: 1.2, accuracy: 0.95, fireRate: 0.6 },
      wand:     { projectile: "✚",  damage: -15,speed: 110, color: "#0f8", mag: 15, reload: 1.0, accuracy: 1.0,  fireRate: 0.5 },
      
      // SPECIAL WEAPONS (Drop-only)
      shotgun:  { projectile: "▓",  damage: 25, speed: 120, color: "#f80", mag: 4,  reload: 2.5, accuracy: 0.50, fireRate: 1.0, pellets: 5, isSpecial: true },
      sniper:   { projectile: "═",  damage: 50, speed: 300, color: "#0ff", mag: 5,  reload: 3.0, accuracy: 0.98, fireRate: 1.5, isSpecial: true },
      laser:    { projectile: "═══", damage: 35, speed: 250, color: "#f0f", mag: 20, reload: 3.5, accuracy: 1.0,  fireRate: 0.3, charge: 1.0, effects: ['fire', 'shock'], isSpecial: true, rarity: 'legendary' }
    };

    const ARCHETYPES = {
      warrior: { name: "Warrior", ascii: "⚔", hp: 40,  atk: 12, spd: 32, weapon: "rifle",  color: "#f88" },
      mage:    { name: "Mage",    ascii: "✦", hp: 28,  atk: 18, spd: 26, weapon: "staff",  color: "#88f" },
      rogue:   { name: "Rogue",   ascii: "►", hp: 32,  atk: 15, spd: 45, weapon: "smg",    color: "#8f8" },
      tank:    { name: "Tank",    ascii: "■", hp: 55,  atk: 10, spd: 22, weapon: "pistol", color: "#aaa" },
      ranger:  { name: "Ranger",  ascii: "↑", hp: 35,  atk: 14, spd: 38, weapon: "bow",    color: "#af8" },
      healer:  { name: "Healer",  ascii: "✚", hp: 30,  atk: 5,  spd: 30, weapon: "wand",   color: "#0f8" },
    };

    const PICKUP_TYPES = {
      health:  { symbol: "❤", color: "#f00", effect: "heal",   value: 20 },
      speed:   { symbol: "⚡", color: "#ff0", effect: "speed",  value: 1.4, duration: 6000 },
      damage:  { symbol: "⚔", color: "#f80", effect: "damage", value: 1.6, duration: 8000 },
      crit:    { symbol: "★", color: "#fa0", effect: "crit",   value: 0.3, duration: 7000 },
      shield:  { symbol: "🛡", color: "#08f", effect: "shield", value: 25, duration: 10000 },
      xp:      { symbol: "💎", color: "#f0f", effect: "xp",     value: 40 },
    };

    // ═══════════════════════════════════════════════════════════════
    // GAME STATE
    // ═══════════════════════════════════════════════════════════════
    const GameState = {
      fighters: [],
      projectiles: [],
      pickups: [],
      container: document.getElementById('game-container'),
      width: window.innerWidth,
      height: window.innerHeight,
      playerData: {},
      chatMessages: [],
      boss: null,
      kothZone: null,
      nezZone: null,
      streamlabsConnected: false,
      lastAISpawn: 0,
      lastBossSpawn: 0,
      lastPickupSpawn: 0,
      lastKOTHMove: 0,
      stats: { kills: 0, startTime: Date.now() },
      lastUpdate: performance.now(),
      frameCount: 0,
      lastFPSUpdate: 0,
      currentFPS: 60,
    };

    // ═══════════════════════════════════════════════════════════════
    // UTILITIES
    // ═══════════════════════════════════════════════════════════════
    function hashUsername(username) {
      let hash = 0;
      for (let i = 0; i < username.length; i++) {
        hash = ((hash << 5) - hash) + username.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getArchetypeForUser(username) {
      const seed = hashUsername(username);
      const archetypes = Object.keys(ARCHETYPES);
      return archetypes[seed % archetypes.length];
    }

    function distance(x1, y1, x2, y2) {
      return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }

    function getColorForUser(username) {
      const hue = hashUsername(username) % 360;
      return `hsl(${hue}, 85%, 65%)`;
    }

    function getPlayerData(username) {
      if (!GameState.playerData[username]) {
        GameState.playerData[username] = {
          username,
          archetype: getArchetypeForUser(username),
          level: 1,
          xp: 0,
          kills: 0,
          deaths: 0,
          score: 0
        };
      }
      return GameState.playerData[username];
    }

    function showFloatingText(x, y, text, color, isCrit = false) {
      const el = document.createElement('div');
      el.className = 'damage-number' + (isCrit ? ' crit' : '');
      el.textContent = text;
      el.style.color = color;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      GameState.container.appendChild(el);
      setTimeout(() => el.remove(), CONFIG.DAMAGE_NUMBER_DURATION);
    }

    function showBossAlert() {
      const alert = document.getElementById('boss-alert');
      alert.style.display = 'block';
      setTimeout(() => { alert.style.display = 'none'; }, CONFIG.BOSS_ALERT_DURATION);
    }

    // ═══════════════════════════════════════════════════════════════
    // NEZ SYSTEM - Invisible wall with repulsion
    // ═══════════════════════════════════════════════════════════════
    function isInsideNEZ(x, y) {
      if (!CONFIG.NEZ_ENABLED) return false;
      return x >= CONFIG.NEZ_X && x <= CONFIG.NEZ_X + CONFIG.NEZ_WIDTH &&
             y >= CONFIG.NEZ_Y && y <= CONFIG.NEZ_Y + CONFIG.NEZ_HEIGHT;
    }

    function getDistanceToNEZ(x, y) {
      if (!CONFIG.NEZ_ENABLED) return Infinity;
      
      const nezLeft = CONFIG.NEZ_X;
      const nezRight = CONFIG.NEZ_X + CONFIG.NEZ_WIDTH;
      const nezTop = CONFIG.NEZ_Y;
      const nezBottom = CONFIG.NEZ_Y + CONFIG.NEZ_HEIGHT;
      
      const distLeft = Math.abs(x - nezLeft);
      const distRight = Math.abs(x - nezRight);
      const distTop = Math.abs(y - nezTop);
      const distBottom = Math.abs(y - nezBottom);
      
      return Math.min(distLeft, distRight, distTop, distBottom);
    }

    function repelFromNEZ(entity) {
      if (!CONFIG.NEZ_ENABLED || !isInsideNEZ(entity.x, entity.y)) return;
      
      const nezLeft = CONFIG.NEZ_X;
      const nezRight = CONFIG.NEZ_X + CONFIG.NEZ_WIDTH;
      const nezTop = CONFIG.NEZ_Y;
      const nezBottom = CONFIG.NEZ_Y + CONFIG.NEZ_HEIGHT;
      
      const distLeft = entity.x - nezLeft;
      const distRight = nezRight - entity.x;
      const distTop = entity.y - nezTop;
      const distBottom = nezBottom - entity.y;
      
      const minDist = Math.min(distLeft, distRight, distTop, distBottom);
      
      // Hard repel with velocity
      if (minDist === distLeft) {
        entity.x = nezLeft - 10;
        entity.vx = -CONFIG.NEZ_REPEL_FORCE;
      } else if (minDist === distRight) {
        entity.x = nezRight + 10;
        entity.vx = CONFIG.NEZ_REPEL_FORCE;
      } else if (minDist === distTop) {
        entity.y = nezTop - 10;
        entity.vy = -CONFIG.NEZ_REPEL_FORCE;
      } else {
        entity.y = nezBottom + 10;
        entity.vy = CONFIG.NEZ_REPEL_FORCE;
      }
    }

    function avoidNEZ(entity) {
      // AI fear behavior near NEZ
      if (!CONFIG.NEZ_ENABLED || entity.isBoss) return { x: 0, y: 0 };
      
      const distToNEZ = getDistanceToNEZ(entity.x, entity.y);
      if (distToNEZ > CONFIG.NEZ_FEAR_DISTANCE) return { x: 0, y: 0 };
      
      const nezCenterX = CONFIG.NEZ_X + CONFIG.NEZ_WIDTH / 2;
      const nezCenterY = CONFIG.NEZ_Y + CONFIG.NEZ_HEIGHT / 2;
      
      const dx = entity.x - nezCenterX;
      const dy = entity.y - nezCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      
      const avoidStrength = (1 - distToNEZ / CONFIG.NEZ_FEAR_DISTANCE) * entity.speed * 0.5;
      
      return {
        x: (dx / dist) * avoidStrength,
        y: (dy / dist) * avoidStrength
      };
    }

    // ═══════════════════════════════════════════════════════════════
    // PICKUP CLASS
    // ═══════════════════════════════════════════════════════════════
    class Pickup {
      constructor(type, x, y) {
        this.type = type;
        this.config = PICKUP_TYPES[type];
        this.x = x !== undefined ? x : Math.random() * GameState.width;
        this.y = y !== undefined ? y : Math.random() * GameState.height;
        this.collected = false;
        this.spawnTime = Date.now();
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.createElement();
      }

      createElement() {
        this.element = document.createElement('div');
        this.element.className = 'pickup';
        this.element.textContent = this.config.symbol;
        this.element.style.color = this.config.color;
        this.element.style.left = `${this.x}px`;
        this.element.style.top = `${this.y}px`;
        GameState.container.appendChild(this.element);
      }

      update(dt) {
        if (this.collected) return;
        
        this.x += this.vx * 20 * dt;
        this.y += this.vy * 20 * dt;
        
        if (this.x < 30) { this.x = 30; this.vx *= -1; }
        if (this.x > GameState.width - 30) { this.x = GameState.width - 30; this.vx *= -1; }
        if (this.y < 30) { this.y = 30; this.vy *= -1; }
        if (this.y > GameState.height - 30) { this.y = GameState.height - 30; this.vy *= -1; }
        
        repelFromNEZ(this);
        
        if (this.element && this.element.parentNode) {
          this.element.style.left = `${this.x}px`;
          this.element.style.top = `${this.y}px`;
        }

        for (const f of GameState.fighters) {
          if (!f.alive || f.isEnemy) continue;
          if (distance(f.x, f.y, this.x, this.y) < CONFIG.COLLISION_RADIUS) {
            f.collectPickup(this);
            this.collected = true;
            this.destroy();
            break;
          }
        }
      }

      destroy() {
        if (this.element && this.element.parentNode) this.element.remove();
        const idx = GameState.pickups.indexOf(this);
        if (idx > -1) GameState.pickups.splice(idx, 1);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // PROJECTILE CLASS
    // ═══════════════════════════════════════════════════════════════
    class Projectile {
      constructor(owner, target, weaponType) {
        this.owner = owner;
        this.weaponType = weaponType;
        this.weapon = WEAPONS[weaponType];
        
        this.x = owner.x;
        this.y = owner.y;
        
        // Calculate accuracy spread
        const spread = (1 - this.weapon.accuracy) * 0.3;
        const angleSpread = (Math.random() - 0.5) * spread;
        
        // Base damage with owner multipliers
        this.baseDamage = this.weapon.damage * (owner.damageMultiplier || 1);
        
        // Crit calculation (owner can have bonus crit)
        const critChance = CONFIG.CRIT_CHANCE + (owner.critBonus || 0);
        this.isCrit = Math.random() < critChance;
        this.damage = this.isCrit ? this.baseDamage * CONFIG.CRIT_MULTIPLIER : this.baseDamage;
        
        this.speed = this.weapon.speed;
        this.color = this.weapon.color;
        this.symbol = this.weapon.projectile;
        this.effects = this.weapon.effects || [];
        this.pellets = this.weapon.pellets || 1;
        
        // Calculate trajectory with spread
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const baseAngle = Math.atan2(dy, dx);
        const finalAngle = baseAngle + angleSpread;
        
        this.vx = Math.cos(finalAngle) * this.speed;
        this.vy = Math.sin(finalAngle) * this.speed;
        
        this.lifetime = 0;
        this.maxLifetime = CONFIG.PROJECTILE_LIFETIME;
        this.hasHit = false;
        
        this.createElement();
      }

      createElement() {
        this.element = document.createElement('div');
        this.element.className = 'projectile' + (this.weapon.rarity === 'legendary' ? ' laser' : '');
        this.element.textContent = this.symbol;
        this.element.style.color = this.color;
        this.element.style.left = `${this.x}px`;
        this.element.style.top = `${this.y}px`;
        this.element.style.transform = 'translate(-50%, -50%)';
        if (this.isCrit) {
          this.element.style.textShadow = `0 0 15px ${this.color}, 0 0 25px ${this.color}`;
        }
        GameState.container.appendChild(this.element);
      }

      update(dt) {
        this.lifetime += dt;
        if (this.lifetime > this.maxLifetime || this.hasHit) {
          this.destroy();
          return;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        // Destroy if hits NEZ
        if (isInsideNEZ(this.x, this.y)) {
          this.destroy();
          return;
        }
        
        if (this.element && this.element.parentNode) {
          this.element.style.left = `${this.x}px`;
          this.element.style.top = `${this.y}px`;
        }

        // Check collision with fighters
        for (const f of GameState.fighters) {
          if (!f.alive || f === this.owner) continue;
          if (f.isEnemy === this.owner.isEnemy && !f.isBoss) continue;
          
          if (distance(f.x, f.y, this.x, this.y) < CONFIG.COLLISION_RADIUS) {
            f.takeDamage(this.damage, this.owner, this.isCrit);
            
            // Apply status effects
            for (const effect of this.effects) {
              if (!f.statusEffects.includes(effect)) {
                f.statusEffects.push(effect);
                setTimeout(() => {
                  const idx = f.statusEffects.indexOf(effect);
                  if (idx > -1) f.statusEffects.splice(idx, 1);
                }, 5000);
              }
            }
            
            // Knockback
            const dx = f.x - this.owner.x;
            const dy = f.y - this.owner.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;
            const knockback = this.isCrit ? CONFIG.KNOCKBACK_STRENGTH * 1.5 : CONFIG.KNOCKBACK_STRENGTH;
            f.vx += (dx / d) * knockback * 0.3;
            f.vy += (dy / d) * knockback * 0.3;
            
            this.hasHit = true;
            this.destroy();
            break;
          }
        }
      }

      destroy() {
        if (this.element && this.element.parentNode) this.element.remove();
        const idx = GameState.projectiles.indexOf(this);
        if (idx > -1) GameState.projectiles.splice(idx, 1);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // FIGHTER CLASS
    // ═══════════════════════════════════════════════════════════════
    class Fighter {
      constructor(username, isEnemy = false, isBoss = false) {
        this.username = username;
        this.isEnemy = isEnemy;
        this.isBoss = isBoss;
        this.alive = true;

        if (isEnemy || isBoss) {
          this.archetype = isBoss ? 'warrior' : Object.keys(ARCHETYPES)[Math.floor(Math.random() * 6)];
          this.level = isBoss ? 10 : Math.floor(Math.random() * 3) + 1;
        } else {
          const data = getPlayerData(username);
          this.archetype = data.archetype;
          this.level = data.level;
          this.xp = data.xp;
        }

        const arch = ARCHETYPES[this.archetype];
        const levelMult = 1 + (this.level - 1) * 0.18;
        
        this.maxHp = Math.round(arch.hp * levelMult * (isBoss ? 6 : isEnemy ? 0.7 : 1));
        this.hp = this.maxHp;
        this.attack = Math.round(arch.atk * levelMult * (isBoss ? 3 : 1));
        this.speed = arch.spd;

        this.color = isBoss ? '#f00' : (arch.color || getColorForUser(username));
        this.ascii = isBoss ? '⚠' : arch.ascii;
        this.weaponType = arch.weapon;
        this.currentAmmo = WEAPONS[this.weaponType].mag;
        this.maxAmmo = WEAPONS[this.weaponType].mag;
        this.reloading = false;
        this.reloadTime = 0;

        this.vx = 0;
        this.vy = 0;
        this.lastAttack = 0;
        this.attackCooldown = WEAPONS[this.weaponType].fireRate * 1000;
        this.statusEffects = [];
        this.buffs = {};
        this.damageMultiplier = 1;
        this.speedMultiplier = 1;
        this.critBonus = 0;
        this.shield = 0;

        this.spawnPosition();
        this.createElement();
      }

      spawnPosition() {
        let attempts = 0;
        do {
          if (this.isBoss) {
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { this.x = Math.random() * GameState.width; this.y = 100; }
            else if (side === 1) { this.x = Math.random() * GameState.width; this.y = GameState.height - 100; }
            else if (side === 2) { this.x = 100; this.y = Math.random() * GameState.height; }
            else { this.x = GameState.width - 100; this.y = Math.random() * GameState.height; }
          } else if (this.isEnemy) {
            this.x = Math.random() * GameState.width;
            this.y = -50;
          } else {
            const angle = Math.random() * Math.PI * 2;
            const dist = 250 + Math.random() * 200;
            this.x = GameState.width / 2 + Math.cos(angle) * dist;
            this.y = GameState.height / 2 + Math.sin(angle) * dist;
          }
          attempts++;
        } while (isInsideNEZ(this.x, this.y) && attempts < 30);
        
        if (isInsideNEZ(this.x, this.y)) {
          this.x = 100;
          this.y = 100;
        }
        
        this.x = Math.max(50, Math.min(GameState.width - 50, this.x));
        this.y = Math.max(50, Math.min(GameState.height - 50, this.y));
      }

      createElement() {
        this.element = document.createElement('div');
        this.element.className = 'entity' + (this.isBoss ? ' boss' : '');
        this.element.style.color = this.color;
        this.element.style.left = `${this.x}px`;
        this.element.style.top = `${this.y}px`;
        this.element.style.transform = 'translate(-50%, -50%)';
        this.updateDisplay();
        GameState.container.appendChild(this.element);
      }

      updateDisplay() {
        const hpPct = Math.max(0, Math.min(1, this.hp / this.maxHp));
        const bars = Math.max(0, Math.ceil(hpPct * 5));
        const emptyBars = Math.max(0, 5 - bars);
        const hpBar = '█'.repeat(bars) + '░'.repeat(emptyBars);
        
        let status = "";
        if (this.statusEffects.includes('fire')) status += '🔥';
        if (this.statusEffects.includes('shock')) status += '⚡';
        if (this.statusEffects.includes('poison')) status += '☠';
        if (this.shield > 0) status += '🛡';
        
        const nameDisplay = this.username.substring(0, 10);
        const ammoDisplay = this.reloading ? ' [R]' : ` [${this.currentAmmo}]`;
        
        if (this.element) {
          this.element.textContent = `${this.ascii}
${nameDisplay}
Lv${this.level}
${hpBar}${status}${ammoDisplay}`;
        }
      }

      collectPickup(pickup) {
        const cfg = pickup.config;
        
        switch(cfg.effect) {
          case 'heal':
            this.hp = Math.min(this.maxHp, this.hp + cfg.value);
            showFloatingText(this.x, this.y - 30, `+${cfg.value} HP`, '#0f0');
            break;
          case 'speed':
            this.buffs.speed = { multiplier: cfg.value, endTime: Date.now() + cfg.duration };
            this.speedMultiplier = cfg.value;
            showFloatingText(this.x, this.y - 30, 'SPEED ⚡', '#ff0');
            break;
          case 'damage':
            this.buffs.damage = { multiplier: cfg.value, endTime: Date.now() + cfg.duration };
            this.damageMultiplier = cfg.value;
            showFloatingText(this.x, this.y - 30, 'POWER ⚔', '#f80');
            break;
          case 'crit':
            this.buffs.crit = { bonus: cfg.value, endTime: Date.now() + cfg.duration };
            this.critBonus = cfg.value;
            showFloatingText(this.x, this.y - 30, 'CRIT ★', '#fa0');
            break;
          case 'shield':
            this.shield = cfg.value;
            showFloatingText(this.x, this.y - 30, `SHIELD ${cfg.value}`, '#08f');
            break;
          case 'xp':
            if (!this.isEnemy) {
              const data = getPlayerData(this.username);
              data.xp += cfg.value;
              this.xp = data.xp;
              this.checkLevelUp();
              showFloatingText(this.x, this.y - 30, `+${cfg.value} XP`, '#f0f');
            }
            break;
        }
      }

      checkLevelUp() {
        const data = getPlayerData(this.username);
        if (data.level < 10 && data.xp >= CONFIG.XP_CURVE[data.level]) {
          data.level++;
          this.level = data.level;
          
          const arch = ARCHETYPES[this.archetype];
          const levelMult = 1 + (this.level - 1) * 0.18;
          this.maxHp = Math.round(arch.hp * levelMult);
          this.hp = Math.min(this.maxHp, this.hp + 25);
          this.attack = Math.round(arch.atk * levelMult);
          
          showFloatingText(this.x, this.y - 50, '★ LEVEL UP! ★', '#ff0');
        }
      }

      reload() {
        if (this.reloading || this.currentAmmo === this.maxAmmo) return;
        this.reloading = true;
        this.reloadTime = WEAPONS[this.weaponType].reload;
      }

      update(dt) {
        if (!this.alive) return;

        const now = Date.now();
        
        // Update buffs
        if (this.buffs.speed && now > this.buffs.speed.endTime) {
          delete this.buffs.speed;
          this.speedMultiplier = 1;
        }
        if (this.buffs.damage && now > this.buffs.damage.endTime) {
          delete this.buffs.damage;
          this.damageMultiplier = 1;
        }
        if (this.buffs.crit && now > this.buffs.crit.endTime) {
          delete this.buffs.crit;
          this.critBonus = 0;
        }

        // Reload handling
        if (this.reloading) {
          this.reloadTime -= dt;
          if (this.reloadTime <= 0) {
            this.reloading = false;
            this.currentAmmo = this.maxAmmo;
          }
        }

        // Status effects
        for (const effect of this.statusEffects) {
          if (effect === 'fire') this.hp -= CONFIG.HEALTH_DECAY_RATE * dt * 2;
          if (effect === 'shock') this.hp -= CONFIG.HEALTH_DECAY_RATE * dt * 1.5;
          if (effect === 'poison') this.hp -= CONFIG.HEALTH_DECAY_RATE * dt;
        }

        // Health decay for players
        if (!this.isEnemy && !this.isBoss) {
          this.hp -= CONFIG.HEALTH_DECAY_RATE * dt;
        }

        // AI behavior
        if (this.isEnemy) this.updateEnemyAI(dt);
        else if (this.isBoss) this.updateBossAI(dt);
        else this.updatePlayerAI(dt);

        // KOTH occupation
        if (GameState.kothZone && !this.isEnemy) {
          const kothDist = distance(this.x, this.y, GameState.kothZone.x, GameState.kothZone.y);
          if (kothDist < CONFIG.KOTH_ZONE_RADIUS) {
            this.hp = Math.min(this.maxHp, this.hp + CONFIG.KOTH_HEAL_PER_SEC * dt);
            const data = getPlayerData(this.username);
            data.xp += CONFIG.KOTH_XP_PER_SEC * dt;
            this.xp = data.xp;
            this.checkLevelUp();
            GameState.kothZone.occupant = this.username;
          }
        }

        // NEZ repulsion
        repelFromNEZ(this);

        // Movement
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.x = Math.max(40, Math.min(GameState.width - 40, this.x));
        this.y = Math.max(40, Math.min(GameState.height - 40, this.y));

        if (this.element && this.element.parentNode) {
          this.element.style.left = `${this.x}px`;
          this.element.style.top = `${this.y}px`;
        }
        
        if (this.hp <= 0) this.die();
        this.updateDisplay();
      }

      updatePlayerAI(dt) {
        let target = null;
        let minDist = Infinity;

        // Auto-reload if empty
        if (this.currentAmmo === 0 && !this.reloading) {
          this.reload();
        }

        // Priority 1: Seek pickups if low health or no ammo
        if (this.hp < this.maxHp * 0.5 || this.currentAmmo < 3) {
          for (const pickup of GameState.pickups) {
            if (pickup.collected) continue;
            const dist = distance(this.x, this.y, pickup.x, pickup.y);
            if (this.hp < this.maxHp * 0.4 && pickup.type === 'health') {
              if (dist < 450 && dist < minDist) {
                minDist = dist;
                target = { x: pickup.x, y: pickup.y, isPickup: true };
              }
            } else if (dist < 350 && dist < minDist) {
              minDist = dist;
              target = { x: pickup.x, y: pickup.y, isPickup: true };
            }
          }
        }

        // Priority 2: Attack enemies
        if (!target && this.currentAmmo > 0 && !this.reloading && this.hp > this.maxHp * 0.3) {
          for (const f of GameState.fighters) {
            if (!f.alive || f === this || !f.isEnemy) continue;
            const dist = distance(this.x, this.y, f.x, f.y);
            if (dist < 600 && dist < minDist) {
              minDist = dist;
              target = f;
            }
          }
        }

        // Priority 3: KOTH
        if (!target && this.hp > this.maxHp * 0.5 && GameState.kothZone) {
          const kothDist = distance(this.x, this.y, GameState.kothZone.x, GameState.kothZone.y);
          if (kothDist > CONFIG.KOTH_ZONE_RADIUS) {
            target = { x: GameState.kothZone.x, y: GameState.kothZone.y, isZone: true };
          }
        }

        // NEZ avoidance
        const avoidForce = avoidNEZ(this);

        if (target) {
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          
          if (target.isPickup || target.isZone || dist > 200) {
            const moveSpeed = this.speed * this.speedMultiplier;
            this.vx += ((dx / dist) * moveSpeed + avoidForce.x) * 0.35;
            this.vy += ((dy / dist) * moveSpeed + avoidForce.y) * 0.35;
          } else {
            this.vx = (this.vx * 0.85) + avoidForce.x * 0.4;
            this.vy = (this.vy * 0.85) + avoidForce.y * 0.4;
            
            const now = performance.now();
            if (now - this.lastAttack > this.attackCooldown && this.currentAmmo > 0 && !this.reloading) {
              this.attackTarget(target);
              this.lastAttack = now;
            }
          }
        } else {
          this.vx += avoidForce.x * 0.5;
          this.vy += avoidForce.y * 0.5;
        }
      }

      updateEnemyAI(dt) {
        this.y += 18 * dt;
        
        if (this.y > GameState.height + 70) {
          this.destroy();
          return;
        }

        // Auto-reload
        if (this.currentAmmo === 0 && !this.reloading) this.reload();

        let target = null;
        let minDist = 280;
        
        for (const f of GameState.fighters) {
          if (!f.alive || f.isEnemy) continue;
          const dist = distance(this.x, this.y, f.x, f.y);
          if (dist < minDist) {
            minDist = dist;
            target = f;
          }
        }

        // NEZ avoidance
        const avoidForce = avoidNEZ(this);

        if (target) {
          const dx = target.x - this.x;
          const dist = Math.sqrt(dx * dx + (target.y - this.y) ** 2) || 1;
          this.vx = ((dx / dist) * this.speed * 0.55) + avoidForce.x * 0.6;
          
          const now = performance.now();
          if (now - this.lastAttack > this.attackCooldown && dist < 220 && this.currentAmmo > 0 && !this.reloading) {
            this.attackTarget(target);
            this.lastAttack = now;
          }
        } else {
          this.vx += avoidForce.x * 0.6;
        }
      }

      updateBossAI(dt) {
        if (this.currentAmmo === 0 && !this.reloading) this.reload();

        let target = null;
        let minDist = Infinity;
        
        for (const f of GameState.fighters) {
          if (!f.alive || f.isEnemy || f.isBoss) continue;
          const dist = distance(this.x, this.y, f.x, f.y);
          if (dist < minDist) {
            minDist = dist;
            target = f;
          }
        }

        if (target) {
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          
          if (dist > 150) {
            this.vx += (dx / dist) * this.speed * 0.8 * dt * 50;
            this.vy += (dy / dist) * this.speed * 0.8 * dt * 50;
          }
          
          const now = performance.now();
          if (now - this.lastAttack > this.attackCooldown && this.currentAmmo > 0 && !this.reloading) {
            this.attackTarget(target);
            this.lastAttack = now;
          }
        }
      }

      attackTarget(target) {
        if (!target || !target.alive || this.currentAmmo <= 0 || this.reloading) return;
        
        this.currentAmmo--;
        
        // Shotgun fires multiple pellets
        if (WEAPONS[this.weaponType].pellets) {
          for (let i = 0; i < WEAPONS[this.weaponType].pellets; i++) {
            const proj = new Projectile(this, target, this.weaponType);
            GameState.projectiles.push(proj);
          }
        } else {
          const proj = new Projectile(this, target, this.weaponType);
          GameState.projectiles.push(proj);
        }
        
        if (this.currentAmmo === 0 && !this.isEnemy && !this.isBoss) {
          this.reload();
        }
      }

      takeDamage(amount, attacker, isCrit = false) {
        let finalDamage = amount;
        
        if (this.shield > 0 && amount > 0) {
          const absorbed = Math.min(this.shield, amount);
          this.shield -= absorbed;
          finalDamage = amount - absorbed;
          showFloatingText(this.x - 20, this.y - 28, `-${Math.round(absorbed)} 🛡`, '#08f');
        }
        
        this.hp -= finalDamage;
        
        const dmgColor = finalDamage < 0 ? '#0f8' : (isCrit ? '#ff0' : '#f66');
        const prefix = finalDamage < 0 ? '+' : '-';
        const text = isCrit ? `CRIT! ${prefix}${Math.abs(Math.round(finalDamage))}` : `${prefix}${Math.abs(Math.round(finalDamage))}`;
        showFloatingText(this.x, this.y - 22, text, dmgColor, isCrit);
        
        if (this.hp <= 0) this.die(attacker);
      }

      die(killer) {
        this.alive = false;
        if (this.element) this.element.style.opacity = '0.25';
        GameState.stats.kills++;
        
        if (killer && !killer.isEnemy) {
          const data = getPlayerData(killer.username);
          data.kills++;
          
          const xpGain = this.isBoss ? CONFIG.XP_PER_BOSS : this.isEnemy ? CONFIG.XP_PER_AI_KILL : CONFIG.XP_PER_KILL;
          data.xp += xpGain;
          data.score += xpGain + (this.isBoss ? 500 : this.isEnemy ? 10 : 100);
          killer.xp = data.xp;
          killer.checkLevelUp();
          
          showFloatingText(killer.x, killer.y - 55, `+${xpGain} XP`, '#fa0');
          
          // Drop chance for special weapons
          if (this.isEnemy && Math.random() < 0.15) {
            const specialWeapons = ['shotgun', 'sniper'];
            if (Math.random() < 0.05) specialWeapons.push('laser');
            const weaponDrop = specialWeapons[Math.floor(Math.random() * specialWeapons.length)];
            // TODO: Create weapon pickup
          }
        }
        
        if (this.isBoss) {
          GameState.boss = null;
          // Bonus loot
          for (let i = 0; i < 8; i++) {
            const types = Object.keys(PICKUP_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];
            const angle = (Math.PI * 2 * i) / 8;
            const dist = 100;
            const px = this.x + Math.cos(angle) * dist;
            const py = this.y + Math.sin(angle) * dist;
            GameState.pickups.push(new Pickup(type, px, py));
          }
        }
        
        setTimeout(() => this.destroy(), 1400);
      }

      destroy() {
        if (this.element && this.element.parentNode) this.element.remove();
        const idx = GameState.fighters.indexOf(this);
        if (idx > -1) GameState.fighters.splice(idx, 1);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // STREAMLABS API INTEGRATION
    // ═══════════════════════════════════════════════════════════════
    function connectStreamlabs() {
      if (!CONFIG.STREAMLABS_SOCKET_TOKEN) {
        console.warn('[STREAMLABS] No token provided - running in test mode');
        CONFIG.TEST_MODE = true;
        updateConnectionStatus('test-mode', 'TEST MODE');
        return;
      }

      console.log('[STREAMLABS] Connecting...');
      
      const socket = io('https://sockets.streamlabs.com', {
        transports: ['websocket'],
        query: { token: CONFIG.STREAMLABS_SOCKET_TOKEN }
      });

      socket.on('connect', () => {
        console.log('[STREAMLABS] Connected!');
        GameState.streamlabsConnected = true;
        updateConnectionStatus('connected', 'LIVE');
      });

      socket.on('disconnect', () => {
        console.log('[STREAMLABS] Disconnected');
        GameState.streamlabsConnected = false;
        updateConnectionStatus('test-mode', 'DISCONNECTED');
      });

      socket.on('event', (data) => {
        console.log('[STREAMLABS] Event:', data.type);
        
        switch(data.type) {
          case 'donation':
            handleDonation(data.message[0]);
            break;
          case 'subscription':
          case 'resub':
            handleSubscription(data.message[0]);
            break;
          case 'follow':
            handleFollow(data.message[0]);
            break;
        }
      });

      // YouTube/Twitch chat handling would go here
      // This requires additional API setup specific to each platform
    }

    function handleDonation(data) {
      const username = data.name || 'Anonymous';
      const amount = parseFloat(data.amount) || 0;
      
      console.log(`[DONATION] ${username} donated ${amount}`);
      addChatLine(username, `donated ${amount}!`);
      
      const fighter = spawnPlayer(username);
      if (fighter) {
        // Bonus based on amount
        const bonusXP = Math.floor(amount * 20);
        const bonusHP = Math.floor(amount * 5);
        fighter.hp = Math.min(fighter.maxHp, fighter.hp + bonusHP);
        const data = getPlayerData(username);
        data.xp += bonusXP;
        fighter.xp = data.xp;
        fighter.checkLevelUp();
        showFloatingText(fighter.x, fighter.y - 40, `+${bonusXP} XP!`, '#ff0');
      }
      
      // Spawn boss for big donations
      if (amount >= 5) {
        spawnBoss();
      }
    }

    function handleSubscription(data) {
      const username = data.name || 'Subscriber';
      console.log(`[SUB] ${username} subscribed`);
      addChatLine(username, 'just subscribed!');
      
      const fighter = spawnPlayer(username);
      if (fighter) {
        fighter.hp = fighter.maxHp;
        fighter.shield = 30;
        const playerData = getPlayerData(username);
        playerData.xp += 100;
        fighter.xp = playerData.xp;
        fighter.checkLevelUp();
        showFloatingText(fighter.x, fighter.y - 40, '+100 XP + SHIELD!', '#0ff');
      }
    }

    function handleFollow(data) {
      const username = data.name || 'Follower';
      console.log(`[FOLLOW] ${username} followed`);
      addChatLine(username, 'started following!');
      spawnPlayer(username);
    }

    function handleChatMessage(username, message) {
      console.log(`[CHAT] ${username}: ${message}`);
      addChatLine(username, message);
      spawnPlayer(username);
    }

    function updateConnectionStatus(className, text) {
      const statusEl = document.getElementById('connection-status');
      statusEl.className = className;
      statusEl.textContent = text;
    }

    // ═══════════════════════════════════════════════════════════════
    // SPAWNERS
    // ═══════════════════════════════════════════════════════════════
    function spawnPlayer(username) {
      const existing = GameState.fighters.find(f => 
        f.username === username && f.alive && !f.isEnemy
      );
      
      if (existing) {
        existing.hp = Math.min(existing.maxHp, existing.hp + 25);
        showFloatingText(existing.x, existing.y - 30, '+25 HP', '#0f0');
        return existing;
      }
      
      if (GameState.fighters.length >= CONFIG.MAX_FIGHTERS) {
        console.warn('[SPAWN] Max fighters reached');
        return null;
      }
      
      const fighter = new Fighter(username, false, false);
      GameState.fighters.push(fighter);
      console.log(`[SPAWN] ${username} joined as ${fighter.archetype}`);
      return fighter;
    }

    function spawnAIEnemy() {
      if (GameState.fighters.filter(f => f.isEnemy).length >= CONFIG.MAX_FIGHTERS / 2) return;
      const fighter = new Fighter('AI_' + Date.now(), true, false);
      GameState.fighters.push(fighter);
    }

    function spawnBoss() {
      if (GameState.boss && GameState.boss.alive) return;
      
      const boss = new Fighter('⚠ BOSS ⚠', true, true);
      GameState.fighters.push(boss);
      GameState.boss = boss;
      showBossAlert();
      console.log('[BOSS] Spawned!');
    }

    function spawnPickup(type, x, y) {
      if (GameState.pickups.length >= CONFIG.MAX_PICKUPS) {
        const oldest = GameState.pickups.shift();
        if (oldest) oldest.destroy();
      }
      
      let px = x, py = y;
      if (px === undefined || py === undefined) {
        let attempts = 0;
        do {
          px = Math.random() * GameState.width;
          py = Math.random() * GameState.height;
          attempts++;
        } while (isInsideNEZ(px, py) && attempts < 50);
      }
      
      const pickup = new Pickup(type, px, py);
      GameState.pickups.push(pickup);
    }

    function spawnRandomPickups() {
      const types = Object.keys(PICKUP_TYPES);
      const count = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        spawnPickup(type);
      }
    }

    function addChatLine(username, message) {
      GameState.chatMessages.push({ username, message, time: Date.now() });
      const retainer = document.getElementById('chat-retainer');
      const line = document.createElement('div');
      line.className = 'chat-line';
      line.textContent = `${username}: ${message.substring(0, 60)}`;
      retainer.appendChild(line);
      while (retainer.children.length > 8) retainer.children[1].remove();
      retainer.scrollTop = retainer.scrollHeight;
    }

    // ═══════════════════════════════════════════════════════════════
    // KOTH ZONE
    // ═══════════════════════════════════════════════════════════════
    function updateKOTHZone() {
      const now = performance.now();
      
      if (!GameState.kothZone || now - GameState.lastKOTHMove > CONFIG.KOTH_RELOCATE_INTERVAL) {
        if (GameState.kothZone && GameState.kothZone.element) {
          GameState.kothZone.element.remove();
          if (GameState.kothZone.label) GameState.kothZone.label.remove();
        }
        
        const margin = CONFIG.KOTH_ZONE_RADIUS + 120;
        let x, y;
        let attempts = 0;
        
        do {
          x = margin + Math.random() * (GameState.width - margin * 2);
          y = margin + Math.random() * (GameState.height - margin * 2);
          attempts++;
        } while (isInsideNEZ(x, y) && attempts < 60);
        
        GameState.kothZone = { x, y, occupant: null };
        GameState.lastKOTHMove = now;
        
        const zoneEl = document.createElement('div');
        zoneEl.className = 'koth-zone';
        zoneEl.style.left = `${x - CONFIG.KOTH_ZONE_RADIUS}px`;
        zoneEl.style.top = `${y - CONFIG.KOTH_ZONE_RADIUS}px`;
        zoneEl.style.width = `${CONFIG.KOTH_ZONE_RADIUS * 2}px`;
        zoneEl.style.height = `${CONFIG.KOTH_ZONE_RADIUS * 2}px`;
        GameState.container.appendChild(zoneEl);
        GameState.kothZone.element = zoneEl;
        
        const label = document.createElement('div');
        label.className = 'koth-label';
        label.textContent = '👑 KING OF THE HILL';
        label.style.left = `${x - 70}px`;
        label.style.top = `${y - CONFIG.KOTH_ZONE_RADIUS - 28}px`;
        GameState.container.appendChild(label);
        GameState.kothZone.label = label;
      }
      
      if (GameState.kothZone) {
        if (GameState.kothZone.occupant) {
          GameState.kothZone.label.textContent = `👑 ${GameState.kothZone.occupant}`;
        } else {
          GameState.kothZone.label.textContent = '👑 KING OF THE HILL';
        }
        GameState.kothZone.occupant = null;
      }
    }

    function initNEZ() {
      if (!CONFIG.NEZ_ENABLED) return;
      
      GameState.nezZone = {
        x: CONFIG.NEZ_X,
        y: CONFIG.NEZ_Y,
        width: CONFIG.NEZ_WIDTH,
        height: CONFIG.NEZ_HEIGHT
      };
      
      console.log(`[NEZ] Initialized - No-Entry Zone at x=${CONFIG.NEZ_X}, y=${CONFIG.NEZ_Y}, ${CONFIG.NEZ_WIDTH}x${CONFIG.NEZ_HEIGHT} (INVISIBLE WALL)`);
    }

    // ═══════════════════════════════════════════════════════════════
    // HUD UPDATES
    // ═══════════════════════════════════════════════════════════════
    function updateStats() {
      const players = GameState.fighters.filter(f => !f.isEnemy && f.alive).length;
      const enemies = GameState.fighters.filter(f => f.isEnemy && f.alive).length;
      const total = GameState.fighters.filter(f => f.alive).length;
      const pickups = GameState.pickups.filter(p => !p.collected).length;
      
      document.getElementById('player-count').textContent = players;
      document.getElementById('ai-count').textContent = enemies;
      document.getElementById('total-fighters').textContent = total;
      document.getElementById('ammo-count').textContent = pickups;
      document.getElementById('kill-count').textContent = GameState.stats.kills;
      
      const elapsed = Date.now() - GameState.stats.startTime;
      const minutes = Math.floor(elapsed / 60000);
      const seconds = Math.floor((elapsed % 60000) / 1000);
      document.getElementById('runtime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateLeaderboard() {
      const leaderboard = document.getElementById('leaderboard');
      const players = Object.values(GameState.playerData)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
      
      let html = '<h3>★ TOP FIGHTERS</h3>';
      
      if (players.length === 0) {
        html += '<div class="leader-entry" style="color: #555;">Awaiting warriors...</div>';
      } else {
        for (let i = 0; i < players.length; i++) {
          const p = players[i];
          const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
          html += `
            <div class="leader-entry">
              <span class="leader-name">${medal} ${p.username.substring(0, 12)}</span>
              <span class="leader-score">Lv${p.level} (${p.score})</span>
            </div>
          `;
        }
      }
      
      leaderboard.innerHTML = html;
    }

    function updateFPS() {
      const now = performance.now();
      GameState.frameCount++;
      
      if (now - GameState.lastFPSUpdate > CONFIG.FPS_UPDATE_INTERVAL) {
        const elapsed = (now - GameState.lastFPSUpdate) / 1000;
        GameState.currentFPS = Math.round(GameState.frameCount / elapsed);
        document.getElementById('fps').textContent = GameState.currentFPS;
        
        GameState.frameCount = 0;
        GameState.lastFPSUpdate = now;
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // GAME LOOP
    // ═══════════════════════════════════════════════════════════════
    function gameLoop() {
      const now = performance.now();
      const dt = Math.min((now - GameState.lastUpdate) / 1000, 0.1);
      GameState.lastUpdate = now;

      // Update entities
      for (const fighter of GameState.fighters.slice()) fighter.update(dt);
      for (const proj of GameState.projectiles.slice()) proj.update(dt);
      for (const pickup of GameState.pickups.slice()) pickup.update(dt);

      // Spawn cycles
      if (now - GameState.lastAISpawn > CONFIG.AI_SPAWN_INTERVAL) {
        spawnAIEnemy();
        GameState.lastAISpawn = now;
      }

      if (CONFIG.TEST_MODE && now - GameState.lastBossSpawn > CONFIG.BOSS_SPAWN_INTERVAL) {
        spawnBoss();
        GameState.lastBossSpawn = now;
      }

      if (now - GameState.lastPickupSpawn > CONFIG.PICKUP_SPAWN_INTERVAL) {
        spawnRandomPickups();
        GameState.lastPickupSpawn = now;
      }

      // Update zones & HUD
      updateKOTHZone();
      updateStats();
      updateFPS();

      if (Math.floor(now / 3000) !== Math.floor((now - dt * 1000) / 3000)) {
        updateLeaderboard();
      }

      requestAnimationFrame(gameLoop);
    }

    // ═══════════════════════════════════════════════════════════════
    // TEST MODE
    // ═══════════════════════════════════════════════════════════════
    function spawnTestFighter() {
      const archetypes = Object.keys(ARCHETYPES);
      const archetype = archetypes[Math.floor(Math.random() * archetypes.length)];
      const name = `Test${archetype}${Math.floor(Math.random() * 999)}`;
      
      const fighter = spawnPlayer(name);
      if (fighter) {
        const testWords = ['power up!', 'ready to fight', 'lets go', 'attack!', 'defend', 'heal me'];
        const message = testWords[Math.floor(Math.random() * testWords.length)];
        addChatLine(name, message);
        console.log(`[TEST] Spawned: ${name} (${archetype})`);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      GameState.width = window.innerWidth;
      GameState.height = window.innerHeight;
    });

    console.log('Initializing game...');
    
    // Initialize NEZ
    if (CONFIG.NEZ_ENABLED) initNEZ();
    
    // Connect to Streamlabs
    connectStreamlabs();
    
    // Start game loop
    gameLoop();
    console.log('[INIT] Game loop started');

    // Test mode
    if (CONFIG.TEST_MODE) {
      console.log('[TEST] Test mode enabled - spawning fighters...');
      
      setTimeout(() => {
        spawnTestFighter();
        spawnTestFighter();
        setInterval(spawnTestFighter, 12000);
      }, 2000);
    }

    console.log('═'.repeat(60));
    console.log('✓ Game ready! Waiting for warriors...');
    console.log('═'.repeat(60));
  </script>
</body>
</html>
