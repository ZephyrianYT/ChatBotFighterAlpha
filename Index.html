<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Battle Royale</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  color: #00ff00;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: transparent;
}

/* HUD */
#stats-panel {
  position: fixed; top: 20px; left: 20px;
  background: rgba(0,0,0,0.85);
  padding: 12px;
  border: 2px solid #333;
  font-size: 11px;
  z-index: 1000;
  min-width: 220px;
  color: #888;
  border-radius: 4px;
}
#stats-panel h3 {
  color: #0f0;
  margin-bottom: 8px;
  font-size: 13px;
  text-shadow: 0 0 5px #0f0;
}
.stat-row { margin: 4px 0; display: flex; justify-content: space-between; }
.stat-value { color: #0ff; font-weight: bold; }

#leaderboard {
  position: fixed; bottom: 20px; right: 20px;
  background: rgba(0,0,0,0.85);
  padding: 12px;
  border: 2px solid #333;
  font-size: 11px;
  z-index: 1000;
  min-width: 240px;
  max-height: 300px;
  overflow-y: auto;
  border-radius: 4px;
}
#leaderboard h3 {
  color: #ff0;
  margin-bottom: 8px;
  font-size: 13px;
  text-shadow: 0 0 5px #ff0;
}
.leader-entry { color: #888; margin: 3px 0; display: flex; justify-content: space-between; }
.leader-name { color: #0ff; }
.leader-score { color: #f80; }

#chat-retainer {
  position: fixed; bottom: 20px; left: 20px;
  background: rgba(0,0,0,0.85);
  padding: 10px;
  border: 2px solid #333;
  max-width: 350px;
  z-index: 999;
  max-height: 120px;
  overflow-y: auto;
  border-radius: 4px;
}
#chat-retainer h4 {
  color: #0f0;
  margin-bottom: 5px;
  font-size: 11px;
  text-shadow: 0 0 5px #0f0;
}
.chat-line { color: #888; margin: 3px 0; font-size: 10px; word-wrap: break-word; }

/* Entities & FX */
.entity {
  position: absolute;
  font-size: 14px;
  white-space: pre;
  pointer-events: none;
  line-height: 1.2;
  font-weight: bold;
  text-shadow: 0 0 3px currentColor;
  transition: none;
}
.projectile {
  position: absolute;
  font-size: 10px;
  pointer-events: none;
  white-space: nowrap;
  font-weight: bold;
  animation: pulse 0.6s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.15); }
}
.ammo-particle {
  position: absolute;
  font-size: 11px;
  color: #fa0;
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 0 0 5px #fa0;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}
.damage-number {
  position: absolute;
  font-size: 13px;
  font-weight: bold;
  animation: fade-up 1.6s ease-out forwards;
  pointer-events: none;
  text-shadow: 0 0 5px currentColor;
}
@keyframes fade-up {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-24px); opacity: 0; }
}
.heal-number { color: #0f0; }
.fire-number { color: #f40; }
.ice-number { color: #0cf; }
.poison-number { color: #8f0; }

/* Connection */
#connection-status {
  position: fixed;
  top: 20px; right: 20px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.85);
  border: 2px solid #333;
  font-size: 11px;
  z-index: 1000;
  color: #888;
  border-radius: 4px;
}
#connection-status.connected {
  color: #0f0;
  text-shadow: 0 0 5px #0f0;
}

/* KOTH zone */
.koth-zone {
  position: absolute;
  border: 2px dashed #ff0;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.25;
  animation: zone-pulse 3s ease-in-out infinite;
}
@keyframes zone-pulse {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(1.03); }
}
</style>
</head>
<body>
<div id="game-container"></div>

<!-- Event Alert Display (15-second notifications) -->
<div id="event-alert" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
  background: rgba(0,0,0,0.95); border: 3px solid #0ff; color: #0ff; padding: 20px 30px; 
  font-size: 18px; z-index: 9999; display: none; text-align: center; border-radius: 8px; 
  box-shadow: 0 0 20px #0ff; min-width: 400px; max-width: 600px;">
  <div id="alert-title" style="font-size: 24px; font-weight: bold; margin-bottom: 10px;"></div>
  <div id="alert-message" style="font-size: 16px;"></div>
</div>

<div id="stats-panel">
  <h3>> BATTLE STATS</h3>
  <div class="stat-row"><span>Players:</span><span class="stat-value" id="player-count">0</span></div>
  <div class="stat-row"><span>AI Enemies:</span><span class="stat-value" id="ai-count">0</span></div>
  <div class="stat-row"><span>Active:</span><span class="stat-value" id="total-fighters">0</span></div>
  <div class="stat-row"><span>Ammo:</span><span class="stat-value" id="ammo-count">0</span></div>
  <div class="stat-row"><span>Defeated:</span><span class="stat-value" id="kill-count">0</span></div>
</div>

<div id="leaderboard"><h3>* TOP FIGHTERS</h3></div>
<div id="connection-status" class="disconnected">Connecting ...</div>

<div id="chat-retainer">
  <h4>. CHAT</h4>
</div>

<script>

// ============================================================================
// SECTION 1: LOGIN & CREDENTIALS
// ============================================================================
const CONFIG = {
  // Streamlabs Socket Token - Add your token here for production
  SOCKET_TOKEN: "",
  ACCESS_TOKEN: "",
  TEST_MODE: true,
  
  // Game Balance
  KNOCKBACK_STRENGTH: 22,
  AMMO_LIFETIME: 25000,
  HEALTH_DECAY_RATE: 0.1,
  INACTIVE_THRESHOLD: 30000,
  AI_SPAWN_INTERVAL: 20000,
  
  // KOTH Settings - smaller and moves more frequently
  KOTH_ZONE_RADIUS: 80,  // Smaller ring
  KOTH_POINTS_PER_SEC: 3,
  KOTH_MOVE_INTERVAL: 15000, // Move every 15 seconds
  
  // Center screen avoidance (for stream overlay)
  CENTER_AVOID_X: 960,  // 1920/2
  CENTER_AVOID_Y: 540,  // 1080/2
  CENTER_AVOID_RADIUS: 250, // Larger avoidance zone
  
  // Progression
  XP_CURVE: [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200],
};

// ============================================================================
// SECTION 2: GAME MODE & ASSOCIATED SETTINGS
// ============================================================================
const GameState = {
  fighters: [],
  projectiles: [],
  ammo: [],
  container: document.getElementById('game-container'),
  width: window.innerWidth,
  height: window.innerHeight,
  playerData: {},
  chatMessages: [],
  boss: null,
  kothZone: null,
  lastAISpawn: 0,
  lastKOTHMove: 0,
  stats: { kills: 0 },
  lastUpdate: performance.now(),
  zephyrRespawnTime: null, // Track when Zephyr can respawn
  zephyr: null, // Reference to Zephyr
  playerRespawnTimes: {}, // Track when each player can respawn (username: timestamp)
};

window.addEventListener('resize', () => {
  GameState.width = window.innerWidth;
  GameState.height = window.innerHeight;
});

// ============================================================================
// SECTION 3: STREAMLABS LOGIC & EVENT HANDLING
// ============================================================================

// WebSocket connection to Streamlabs
let socket = null;
let reconnectAttempts = 0;

function connectStreamlabs() {
  if (!CONFIG.SOCKET_TOKEN || CONFIG.SOCKET_TOKEN.length < 20) {
    const cs = document.getElementById('connection-status');
    cs.textContent = '> Invalid Token';
    cs.className = 'disconnected';
    return;
  }
  
  try {
    const eioVersion = reconnectAttempts % 2 === 0 ? '4' : '3';
    const url = 'wss://sockets.streamlabs.com/socket.io/?token=' + CONFIG.SOCKET_TOKEN + '&transport=websocket&EIO=' + eioVersion;
    socket = new WebSocket(url);

    socket.onopen = () => {
      reconnectAttempts = 0;
      const cs = document.getElementById('connection-status');
      cs.textContent = 'Connected';
      cs.className = 'connected';
    };
    
    socket.onmessage = (event) => {
      const msg = event.data;
      if (msg.startsWith('2')) socket.send('3'); // Pong
      else if (msg.startsWith('42')) {
        try {
          const jsonStr = msg.substring(2);
          const data = JSON.parse(jsonStr);
          handleStreamlabsEvent(data);
        } catch (e) {}
      }
    };
    
    socket.onerror = () => {
      const cs = document.getElementById('connection-status');
      cs.textContent = '> Error';
      cs.className = 'disconnected';
    };
    
    socket.onclose = () => {
      const cs = document.getElementById('connection-status');
      cs.textContent = 'Disconnected';
      cs.className = 'disconnected';
      reconnectAttempts++;
      if (reconnectAttempts < 5) {
        const delay = Math.min(5000 * reconnectAttempts, 30000);
        setTimeout(connectStreamlabs, delay);
      } else {
        cs.textContent = 'Failed';
      }
    };
  } catch (e) {
    const cs = document.getElementById('connection-status');
    cs.textContent = '> Failed';
    cs.className = 'disconnected';
  }
}

function handleStreamlabsEvent(data) {
  if (!Array.isArray(data) || data.length < 2) return;
  const eventType = data[0];
  const eventData = data[1];
  if (!eventData) return;

  if (eventType === 'event') {
    const messages = eventData.message || [];
    for (const msg of messages) {
      const username = msg.name || msg.from || 'Viewer';
      const text = msg.message || '';
      const eventSubType = msg.type || '';
      
      // ALL ALERTS SUMMON A BOSS!
      if (eventSubType === 'follow') {
        showEventAlert('*** NEW FOLLOWER ***', username + ' just followed the stream!', '#0ff');
        spawnBoss();
        spawnPlayer(username);
        spawnAmmo(username, 'WELCOME FOLLOW THANKS AWESOME', true);
      } else if (eventSubType === 'subscription' || eventSubType === 'resub') {
        showEventAlert('*** SUBSCRIBER ***', username + ' subscribed to the channel!', '#f0f');
        spawnBoss();
        spawnPlayer(username);
        spawnAmmo(username, 'SUB HYPE LEGENDARY EPIC AMAZING THANKS', true);
        spawnAIEnemy();
        spawnAIEnemy();
        spawnAIEnemy();
      } else if (eventSubType === 'bits' || eventSubType === 'cheer') {
        const amount = msg.amount || 0;
        showEventAlert('*** BITS CHEERED ***', username + ' cheered ' + amount + ' bits!', '#ff0');
        spawnBoss();
        spawnPlayer(username);
        spawnAmmo(username, 'BITS ENERGY BOOST POWER HYPE', true);
        spawnAIEnemy();
        spawnAIEnemy();
      } else {
        // Regular chat message
        spawnPlayer(username);
        if (text && text.length > 0) {
          spawnAmmo(username, text, false);
          addChatLine(username, text);
        }
      }
    }
  }

  if (eventType === 'donation' || eventType === 'tip') {
    const amount = eventData.amount || 0;
    const username = eventData.name || eventData.from || 'Anonymous';
    showEventAlert('*** DONATION ***', username + ' donated $' + amount + '! BOSS INCOMING!', '#0f0');
    spawnBoss();
    spawnBoss(); // Double boss for donations!
    spawnPlayer(username);
    spawnAmmo(username, 'DONATION LEGENDARY EPIC AMAZING INCREDIBLE', true);
  }
}

// Show 15-second event alert in center of screen
function showEventAlert(title, message, color) {
  const alertBox = document.getElementById('event-alert');
  const alertTitle = document.getElementById('alert-title');
  const alertMessage = document.getElementById('alert-message');
  
  alertTitle.textContent = title;
  alertMessage.textContent = message;
  alertBox.style.borderColor = color;
  alertBox.style.color = color;
  alertBox.style.boxShadow = '0 0 20px ' + color;
  alertBox.style.display = 'block';
  
  // Pulse animation
  alertBox.style.animation = 'pulse 0.6s ease-in-out 3';
  
  // Auto-hide after 15 seconds
  setTimeout(() => {
    alertBox.style.display = 'none';
  }, 15000);
}

// ============================================================================
// SECTION 4: FIGHTERS LOGIC & AI BEHAVIOR
// ============================================================================

class Fighter {
  constructor(username, isEnemy = false, isBoss = false) {
    this.username = username;
    this.isEnemy = isEnemy;
    this.isBoss = isBoss;
    this.alive = true;

    // SEED-BASED GENERATION
    if (isEnemy || isBoss) {
      this.archetypeIndex = isBoss ? 0 : Math.floor(Math.random() * 64);
      this.level = isBoss ? 10 : Math.floor(Math.random() * 3) + 1;
    } else {
      const data = getPlayerData(username);
      this.archetypeIndex = data.archetypeIndex;
      this.level = data.level;
      this.xp = data.xp;
    }

    const arch = getArchetypeData(this.archetypeIndex);
    const levelMult = 1 + (this.level - 1) * 0.15;
    this.maxHp = Math.round(arch.hp * levelMult * (isBoss ? 5 : 1));
    this.hp = this.maxHp;
    this.attack = Math.round(arch.atk * levelMult * (isBoss ? 3 : 1));
    this.speed = arch.spd;

    this.color = isZephyr(username) ? '#0ff' : arch.color;
    this.ascii = isZephyr(username) ? '@' : arch.ascii;
    this.projectile = isZephyr(username) ? '+' : arch.projectile;
    this.melee = isZephyr(username) ? '♥' : arch.melee;
    this.weaponIcon = isZephyr(username) ? '♥' : arch.icon;
    this.statusType = isZephyr(username) ? 'heal' : arch.status;
    this.statusChance = isZephyr(username) ? 0.9 : arch.chance;

    // START WITH AMMO! (seed-based amount)
    this.ammoCount = isZephyr(username) ? 999 : (isEnemy ? 15 : arch.ammo);
    this.startingAmmo = this.ammoCount;
    this.vx = 0;
    this.vy = 0;
    this.lastAttack = 0;
    this.attackCooldown = isZephyr(username) ? 1600 : 1800;
    this.baseAttackCooldown = this.attackCooldown;
    this.statusEffects = [];
    this.statusDurations = []; // Track duration for each status
    this.isRaging = false;
    this.lastMoveTime = performance.now();
    this.idleTime = 0;

    // PERSONALITY TRAITS - makes fighters unique and active!
    this.personality = this.assignPersonality();
    this.behaviorTimer = 0;
    this.currentBehavior = 'greedy'; // GET POINTS!
    this.lastBehaviorChange = 0;

    this.anchorX = GameState.width / 2;
    this.anchorY = GameState.height - 80;

    this.spawnPosition();
    this.createElement();
  }

  assignPersonality() {
    // Personality comes from archetype now!
    const arch = getArchetypeData(this.archetypeIndex);
    return arch.behavior;
  }

  spawnPosition() {
    if (this.isEnemy) {
      // Enemies spawn from TOP of screen
      this.x = Math.random() * GameState.width;
      this.y = -50;
    } else if (isZephyr(this.username)) {
      this.x = this.anchorX;
      this.y = this.anchorY;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const distance = 180 + Math.random() * 160;
      this.x = GameState.width / 2 + Math.cos(angle) * distance;
      this.y = GameState.height / 2 + Math.sin(angle) * distance;
    }
    this.x = Math.max(50, Math.min(GameState.width - 50, this.x));
    this.y = Math.max(50, Math.min(GameState.height - 50, this.y));
  }

  createElement() {
    this.element = document.createElement('div');
    this.element.className = 'entity';
    this.element.style.color = this.color;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    if (this.isBoss) this.element.style.fontSize = '24px';
    this.updateDisplay();
    GameState.container.appendChild(this.element);
  }

  updateDisplay() {
    // Clean minimal display with STATUS EFFECTS
    const nameDisplay = this.username.substring(0, 10);
    
    // 3 characters: [Class][Health][Weapon]
    const hpPct = Math.max(0, this.hp / this.maxHp);
    let healthChar = '█';
    if (hpPct < 0.25) healthChar = '░';
    else if (hpPct < 0.5) healthChar = '▒';
    else if (hpPct < 0.75) healthChar = '▓';
    
    const displayChars = this.ascii + healthChar + this.weaponIcon;
    
    // Ammo indicator for players
    const ammoDisplay = this.isEnemy ? '' : '[' + this.ammoCount + ']';
    
    // STATUS EFFECT INDICATOR
    let statusIndicator = '';
    if (this.statusEffects.length > 0) {
      const status = this.statusEffects[0];
      const visual = STATUS_VISUALS[status];
      if (visual) {
        statusIndicator = visual.symbol;
        this.element.style.textShadow = visual.glow;
      }
    } else {
      this.element.style.textShadow = '0 0 3px currentColor';
    }
    
    this.element.textContent = nameDisplay + '\n' + displayChars + statusIndicator + ammoDisplay;
  }

  collectAmmo(word) {
    this.ammoCount++;
    showFloatingText(this.x, this.y - 30, '+' + word, '#fa0');
  }

  update(dt) {
    if (!this.alive) return;

    // CONSTANT HEALTH DECAY - reduces character count naturally
    const currentSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const isIdle = currentSpeed < CONFIG.IDLE_THRESHOLD;
    
    // Base decay for everyone (except Zephyr)
    if (!isZephyr(this.username)) {
      let decayRate = CONFIG.HEALTH_DECAY_RATE;
      
      // PUNISH IDLING - 3x decay if standing still!
      if (isIdle) {
        this.idleTime += dt;
        if (this.idleTime > 1.0) { // After 1 second of idle
          decayRate *= CONFIG.IDLE_DECAY_MULTIPLIER;
          // Show warning
          if (Math.random() < 0.02) {
            showFloatingText(this.x, this.y - 50, 'MOVE!', '#f00');
          }
        }
      } else {
        this.idleTime = 0;
      }
      
      this.hp -= decayRate * dt;
    }

    // Check if in KOTH zone for RAGE boost
    if (GameState.kothZone && !this.isEnemy) {
      const distToZone = distance(this.x, this.y, GameState.kothZone.x, GameState.kothZone.y);
      this.isRaging = distToZone <= CONFIG.KOTH_ZONE_RADIUS;
      // RAGE: 50% faster attacks + HP REGEN in zone!
      this.attackCooldown = this.isRaging ? this.baseAttackCooldown * 0.5 : this.baseAttackCooldown;
      if (this.isRaging) {
        this.hp += CONFIG.HEALTH_DECAY_RATE * 0.5 * dt; // Recover in KOTH
        this.element.style.textShadow = '0 0 10px #ff0, 0 0 15px #f80';
      } else {
        this.element.style.textShadow = '0 0 3px currentColor';
      }
    }

    // STATUS EFFECT DAMAGE/EFFECTS
    for (let i = this.statusEffects.length - 1; i >= 0; i--) {
      const effect = this.statusEffects[i];
      const effectData = this.statusDurations[i];
      
      // Apply damage based on status
      if (effect === 'fire') this.hp -= CONFIG.HEALTH_DECAY_RATE * 1.2 * dt;
      if (effect === 'poison') this.hp -= CONFIG.HEALTH_DECAY_RATE * 0.8 * dt;
      if (effect === 'shock') this.hp -= CONFIG.HEALTH_DECAY_RATE * 0.5 * dt;
      if (effect === 'ice') this.speed = this.speed * 0.7; // Slow
      if (effect === 'stun' && effectData.duration < 1000) continue; // Brief stun
      if (effect === 'slow') this.speed = this.speed * 0.8; // Slow movement
      
      // Decay duration
      effectData.duration -= dt * 1000;
      if (effectData.duration <= 0) {
        this.statusEffects.splice(i, 1);
        this.statusDurations.splice(i, 1);
      }
    }

    if (this.isEnemy) this.updateEnemyAI(dt);
    else if (isZephyr(this.username)) this.updateZephyrAI(dt);
    else this.updatePlayerAI(dt);

    this.vx *= 0.98;
    this.vy *= 0.98;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // CENTER IS NO MAN'S LAND - STRONGLY avoid it!
    const dxCenter = this.x - CONFIG.CENTER_AVOID_X;
    const dyCenter = this.y - CONFIG.CENTER_AVOID_Y;
    const distToCenter = Math.sqrt(dxCenter*dxCenter + dyCenter*dyCenter);
    if (distToCenter < CONFIG.CENTER_AVOID_RADIUS) {
      // STRONG push away from center
      const pushForce = (CONFIG.CENTER_AVOID_RADIUS - distToCenter) / CONFIG.CENTER_AVOID_RADIUS;
      this.vx += (dxCenter / distToCenter) * pushForce * this.speed * 1.5;
      this.vy += (dyCenter / distToCenter) * pushForce * this.speed * 1.5;
      
      // Extra damage in center (danger zone!)
      this.hp -= CONFIG.HEALTH_DECAY_RATE * pushForce * 2 * dt;
    }

    this.x = Math.max(30, Math.min(GameState.width - 30, this.x));
    this.y = Math.max(30, Math.min(GameState.height - 30, this.y));

    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    this.updateDisplay();
  }

  updatePlayerAI(dt) {
    // Dynamic behavior based on personality and situation
    const now = performance.now();
    const hpPct = this.hp / this.maxHp;
    
    // Change behavior dynamically based on situation
    if (now - this.lastBehaviorChange > 3000) {
      if (hpPct < 0.3 && this.personality !== 'aggressive') {
        this.currentBehavior = 'fleeing'; // Low HP = run!
      } else if (this.ammoCount < 1) {
        this.currentBehavior = 'collecting'; // Need resources!
      } else if (hpPct > 0.7 && this.ammoCount > 3) {
        this.currentBehavior = this.personality; // Use personality
      }
      this.lastBehaviorChange = now;
    }
    
    let target = null;
    let minDist = Infinity;
    const searchRange = this.currentBehavior === 'aggressive' ? 600 : 450;

    // BEHAVIOR: FLEEING - run from enemies, seek Zephyr
    if (this.currentBehavior === 'fleeing' && hpPct < 0.4) {
      // Run toward Zephyr if exists
      if (GameState.zephyr && GameState.zephyr.alive) {
        const dist = distance(this.x, this.y, GameState.zephyr.x, GameState.zephyr.y);
        if (dist > 80) {
          target = { x: GameState.zephyr.x, y: GameState.zephyr.y, isFlee: true };
          this.moveAndAttack(target);
          return;
        }
      }
      // Otherwise run from nearest enemy
      let nearestEnemy = null;
      let minEnemyDist = 300;
      for (const f of GameState.fighters) {
        if (!f.alive || !f.isEnemy) continue;
        const dist = distance(this.x, this.y, f.x, f.y);
        if (dist < minEnemyDist) { minEnemyDist = dist; nearestEnemy = f; }
      }
      if (nearestEnemy) {
        // Run opposite direction
        const dx = this.x - nearestEnemy.x;
        const dy = this.y - nearestEnemy.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        this.vx = (dx / d) * this.speed * 1.2;
        this.vy = (dy / d) * this.speed * 1.2;
        return;
      }
    }

    // PRIORITY 1.5: COLLECT AMMO - always seek pickups!
    if (GameState.ammo.length > 0 && (this.ammoCount < 3 || this.currentBehavior === 'collecting' || this.currentBehavior === 'greedy')) {
      for (const ammo of GameState.ammo) {
        if (ammo.collected) continue;
        const dist = distance(this.x, this.y, ammo.x, ammo.y);
        // Ammo is ALWAYS a priority goal!
        if (dist < 500 && dist < minDist) {
          minDist = dist;
          target = { x: ammo.x, y: ammo.y, isAmmo: true };
        }
      }
      if (target) {
        this.moveAndAttack(target);
        return;
      }
    }

    // BEHAVIOR: DETERMINED/GREEDY - rush KOTH for points
    if ((this.currentBehavior === 'determined' || this.currentBehavior === 'greedy') && GameState.kothZone && this.ammoCount > 0) {
      const distToKOTH = distance(this.x, this.y, GameState.kothZone.x, GameState.kothZone.y);
      if (distToKOTH > CONFIG.KOTH_ZONE_RADIUS) {
        target = { x: GameState.kothZone.x, y: GameState.kothZone.y, isKOTH: true };
        this.moveAndAttack(target);
        return;
      }
    }

    // BEHAVIOR: AGGRESSIVE/TACTICAL/SURVIVOR - find and attack
    if (this.ammoCount > 0) {
      for (const f of GameState.fighters) {
        if (!f.alive || f === this) continue;
        if (isZephyr(f.username)) continue;
        
        const dist = distance(this.x, this.y, f.x, f.y);
        if (dist > searchRange) continue;
        
        // Calculate target priority
        const isEnemy = f.isEnemy;
        const targetHP = f.hp / f.maxHp;
        const targetAmmo = f.ammoCount || 0;
        
        let priority = 1.0;
        if (isEnemy) priority = 0.8; // Enemies slightly preferred
        if (this.currentBehavior === 'aggressive') priority *= 0.7; // More aggressive
        if (this.currentBehavior === 'tactical' && targetHP < 0.5) priority *= 0.6; // Target weak
        if (this.currentBehavior === 'survivor' && targetAmmo < 2) priority *= 0.7; // Pick easy fights
        
        const score = dist * priority;
        if (score < minDist) {
          minDist = score;
          target = f;
        }
      }
    }

    // ALWAYS HAVE A GOAL - GET POINTS!
    if (!target) {
      // PRIMARY GOAL: GET TO KOTH FOR POINTS!
      if (GameState.kothZone && this.ammoCount > 0) {
        const distToKOTH = distance(this.x, this.y, GameState.kothZone.x, GameState.kothZone.y);
        if (distToKOTH > CONFIG.KOTH_ZONE_RADIUS + 50) {
          target = { x: GameState.kothZone.x, y: GameState.kothZone.y, isKOTH: true };
        } else {
          // Already in KOTH? Look for kills for more points!
          for (const f of GameState.fighters) {
            if (!f.alive || f === this || isZephyr(f.username)) continue;
            const dist = distance(this.x, this.y, f.x, f.y);
            if (dist < 400) {
              target = f;
              break;
            }
          }
        }
      } else {
        // No ammo? Get some then get points!
        const edges = [
          { x: 150, y: 150 },
          { x: GameState.width - 150, y: 150 },
          { x: 150, y: GameState.height - 150 },
          { x: GameState.width - 150, y: GameState.height - 150 },
        ];
        const randomEdge = edges[Math.floor(Math.random() * edges.length)];
        target = { x: randomEdge.x, y: randomEdge.y, isEdge: true };
      }
    }

    this.moveAndAttack(target);
  }

  updateZephyrAI(dt) {
    let target = null;
    let best = Infinity;

    for (const f of GameState.fighters) {
      if (!f.alive || f.isEnemy || isZephyr(f.username)) continue;
      const hpPct = f.hp / f.maxHp;
      const dist = distance(this.x, this.y, f.x, f.y);
      const score = hpPct * 2 + dist / 600;
      if (score < best) { best = score; target = f; }
    }

    if (!target) {
      const dx = this.anchorX - this.x;
      const dy = this.anchorY - this.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      if (d > 30) { this.vx = (dx / d) * (this.speed * 0.6); this.vy = (dy / d) * (this.speed * 0.6); }
      else { this.vx *= 0.9; this.vy *= 0.9; }
      return;
    }

    const dx = target.x - this.x;
    const dy = target.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;

    if (dist > 140) {
      this.vx = (dx / dist) * (this.speed * 0.85);
      this.vy = (dy / dist) * (this.speed * 0.85);
    } else {
      this.vx *= 0.8; this.vy *= 0.8;
      const now = performance.now();
      if (now - this.lastAttack > this.attackCooldown) {
        const proj = new Projectile(this, target);
        GameState.projectiles.push(proj);
        this.lastAttack = now;
      }
    }
  }

  updateEnemyAI(dt) {
    // Enemies are ALWAYS aggressive - constant threat!
    if (this.y > GameState.height + 50) { this.destroy(); return; }

    let target = null;
    let minDist = 600; // Even larger detection range
    
    // AGGRESSIVE: Always hunting for targets
    for (const f of GameState.fighters) {
      if (!f.alive || f.isEnemy) continue;
      const dist = distance(this.x, this.y, f.x, f.y);
      
      // Prioritize different targets based on enemy personality
      let priority = 1.0;
      if (this.personality === 'aggressive') {
        priority = 0.8;
      } else if (this.personality === 'hunter') {
        const hpPct = f.hp / f.maxHp;
        if (hpPct < 0.5) priority = 0.5; // Strong preference for wounded
      } else if (this.personality === 'determined') {
        if (GameState.kothZone) {
          const distToKOTH = distance(f.x, f.y, GameState.kothZone.x, GameState.kothZone.y);
          if (distToKOTH < CONFIG.KOTH_ZONE_RADIUS * 1.5) priority = 0.6;
        }
      }
      
      const score = dist * priority;
      if (score < minDist) {
        minDist = score;
        target = f;
      }
    }

    if (target) {
      // Chase target aggressively - NEVER IDLE
      const dx = target.x - this.x;
      const dy = target.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      this.vx += (dx / dist) * this.speed * 0.8; // Even more aggressive
      this.vy += (dy / dist) * this.speed * 0.8;
      
      const now = performance.now();
      if (now - this.lastAttack > this.attackCooldown && dist < 300) {
        this.attackTarget(target);
        this.lastAttack = now;
      }
    } else {
      // ALWAYS MOVE - no idle enemies!
      if (GameState.kothZone) {
        // Head to KOTH zone
        const dx = GameState.kothZone.x - this.x;
        const dy = GameState.kothZone.y - this.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        this.vx += (dx / d) * this.speed * 0.6;
        this.vy += (dy / d) * this.speed * 0.6;
      } else {
        // Patrol toward nearest edge (avoid center)
        const toLeft = this.x;
        const toRight = GameState.width - this.x;
        const toTop = this.y;
        const toBottom = GameState.height - this.y;
        const minEdge = Math.min(toLeft, toRight, toTop, toBottom);
        
        if (minEdge === toLeft) this.vx -= this.speed * 0.4;
        else if (minEdge === toRight) this.vx += this.speed * 0.4;
        else if (minEdge === toTop) this.vy -= this.speed * 0.4;
        else this.vy += this.speed * 0.4;
      }
    }
  }

  moveAndAttack(target) {
    if (target) {
      const dx = target.x - this.x;
      const dy = target.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      
      if (target.isFlee || target.isEdge) {
        // Fleeing to safety / Moving to edge - URGENT
        this.vx = (dx / dist) * this.speed * 1.2;
        this.vy = (dy / dist) * this.speed * 1.2;
      } else if (target.isAmmo) {
        // Collect ammo urgently - GOAL
        this.vx = (dx / dist) * this.speed * 1.0;
        this.vy = (dy / dist) * this.speed * 1.0;
      } else if (target.isKOTH) {
        // Move toward KOTH zone - PRIMARY GOAL
        if (dist > CONFIG.KOTH_ZONE_RADIUS) {
          this.vx = (dx / dist) * this.speed * 0.9;
          this.vy = (dy / dist) * this.speed * 0.9;
        } else {
          // In KOTH, keep moving in circle - NO IDLE
          this.vx = (dx / dist) * this.speed * 0.3;
          this.vy = (dy / dist) * this.speed * 0.3;
          // Circular motion in KOTH
          this.vx += -dy * 0.08;
          this.vy += dx * 0.08;
        }
      } else if (dist > 250) {
        // Chase target aggressively
        const speedMult = this.currentBehavior === 'aggressive' ? 1.1 : 1.0;
        this.vx = (dx / dist) * this.speed * speedMult;
        this.vy = (dy / dist) * this.speed * speedMult;
      } else if (dist > 180) {
        // Closing in - strafe while approaching - KEEP MOVING
        this.vx = (dx / dist) * this.speed * 0.9 + -dy * 0.2;
        this.vy = (dy / dist) * this.speed * 0.9 + dx * 0.2;
      } else {
        // In range, attack while moving! - NO STANDING STILL
        this.vx = (dx / dist) * this.speed * 0.5;
        this.vy = (dy / dist) * this.speed * 0.5;
        // Add strafe component
        this.vx += -dy * 0.15;
        this.vy += dx * 0.15;
        
        const now = performance.now();
        if (now - this.lastAttack > this.attackCooldown && this.ammoCount > 0) {
          this.attackTarget(target);
          this.lastAttack = now;
        }
      }
    } else {
      // NEVER TRULY IDLE - always move somewhere
      if (GameState.kothZone) {
        const dx = GameState.kothZone.x - this.x;
        const dy = GameState.kothZone.y - this.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        this.vx += (dx / d) * this.speed * 0.4;
        this.vy += (dy / d) * this.speed * 0.4;
      } else {
        // Drift toward nearest edge
        this.vx *= 0.95;
        this.vy *= 0.95;
      }
    }
  }

  attackTarget(target) {
    if (!target || !target.alive) return;
    if (!this.isEnemy && !isZephyr(this.username) && this.ammoCount > 0) this.ammoCount--;
    const proj = new Projectile(this, target);
    GameState.projectiles.push(proj);
  }

  takeDamage(amount, attacker) {
    this.hp -= amount;
    const isHeal = amount < 0;
    const dmgColor = isHeal ? '#0f8' : '#f66';
    showFloatingText(this.x, this.y - 20, (isHeal ? '+' : '-') + Math.abs(Math.round(amount)), dmgColor);

    // POINTS FOR DAMAGE! (small but adds up)
    if (!isHeal && attacker && !attacker.isEnemy && !isZephyr(attacker.username)) {
      const pdata = getPlayerData(attacker.username);
      const pointsGained = Math.min(Math.abs(amount), 10);
      pdata.points += pointsGained;
      if (Math.random() < 0.15) {
        showFloatingText(attacker.x, attacker.y - 50, '+' + pointsGained + 'pts', '#fa0');
      }
    }

    if (this.hp <= 0) this.die(attacker);
  }

  die(killer) {
    this.alive = false;
    this.element.style.opacity = '0.3';
    GameState.stats.kills++;
    
    // Special handling for Zephyr death - set respawn timer
    if (isZephyr(this.username)) {
      GameState.zephyrRespawnTime = Date.now() + (15 * 60 * 1000); // 15 minutes
      GameState.zephyr = null;
      showFloatingText(GameState.width / 2, 100, 'ZEPHYR FALLEN! Respawn in 15 min', '#f00');
    }
    
    if (killer && !killer.isEnemy && !isZephyr(killer.username)) {
      const data = getPlayerData(killer.username);
      data.kills++;
      data.xp += 50;
      data.points += 50;
      if (data.xp >= CONFIG.XP_CURVE[data.level] && data.level < 10) {
        data.level++;
        showFloatingText(killer.x, killer.y - 40, 'LEVEL UP!', '#ff0');
      }
    }
    setTimeout(() => { this.destroy(); }, 1000);
  }

  destroy() {
    if (this.element) this.element.remove();
    const idx = GameState.fighters.indexOf(this);
    if (idx > -1) GameState.fighters.splice(idx, 1);
  }
}

// ============================================================================
// SECTION 6: PALETTE SEED & COLOR GENERATION
// ============================================================================

function hashUsername(username) {
  let hash = 0;
  for (let i = 0; i < username.length; i++) {
    hash = ((hash << 5) - hash) + username.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getColorForUser(username) {
  const hue = hashUsername(username) % 360;
  return 'hsl(' + hue + ', 80%, 60%)';
}

function getArchetypeForUser(username) {
  const seed = hashUsername(username);
  return seed % 64; // 0-63 maps to archetype array
}

function getArchetypeData(archetypeIndex) {
  return ARCHETYPES[archetypeIndex] || ARCHETYPES[0];
}

function getPlayerData(username) {
  if (!GameState.playerData[username]) {
    GameState.playerData[username] = {
      username,
      archetypeIndex: username === 'Zephyr' ? 60 : getArchetypeForUser(username), // Seed-based
      level: 1,
      xp: 0,
      kills: 0,
      deaths: 0,
      points: 0,
    };
  }
  return GameState.playerData[username];
}

function isZephyr(username) { return username === 'Zephyr'; }

// ============================================================================
// SECTION 7: VISUALS & PROJECTILES
// ============================================================================

class Projectile {
  constructor(owner, target) {
    this.owner = owner;
    this.x = owner.x;
    this.y = owner.y;
    this.damage = owner.attack;
    this.speed = 120; // Standardize projectile speed
    this.color = owner.color;
    this.symbol = owner.projectile;
    this.statusType = owner.statusType;
    this.statusChance = owner.statusChance;
    const dx = target.x - this.x;
    const dy = target.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    this.vx = (dx / dist) * this.speed;
    this.vy = (dy / dist) * this.speed;
    this.lifetime = 0;
    this.maxLifetime = 4.5;
    this.createElement();
  }

  createElement() {
    this.element = document.createElement('div');
    this.element.className = 'projectile';
    this.element.textContent = this.symbol;
    this.element.style.color = this.color;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    GameState.container.appendChild(this.element);
  }

  update(dt) {
    this.lifetime += dt;
    if (this.lifetime > this.maxLifetime) { this.destroy(); return; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';

    for (const f of GameState.fighters) {
      if (!f.alive || f === this.owner) continue;

      const ownerIsEnemy = this.owner.isEnemy;
      const targetIsEnemy = f.isEnemy;
      const friendlyEnemyFire = ownerIsEnemy && targetIsEnemy;
      if (friendlyEnemyFire) continue;

      if (distance(f.x, f.y, this.x, this.y) < 25) {
        f.takeDamage(this.damage, this.owner);
        
        // APPLY STATUS EFFECT BASED ON WEAPON/ARCHETYPE
        if (Math.random() < this.statusChance && this.statusType !== 'heal') {
          f.applyStatus(this.statusType);
        }
        
        const dx = f.x - this.owner.x;
        const dy = f.y - this.owner.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        f.vx += (dx / d) * CONFIG.KNOCKBACK_STRENGTH * 0.2;
        f.vy += (dy / d) * CONFIG.KNOCKBACK_STRENGTH * 0.2;
        this.destroy();
        break;
      }
    }
  }

  destroy() {
    if (this.element) this.element.remove();
    const idx = GameState.projectiles.indexOf(this);
    if (idx > -1) GameState.projectiles.splice(idx, 1);
  }
}

class Ammo {
  constructor(word, x, y) {
    this.word = word;
    this.x = (typeof x === 'number' ? x : Math.random() * GameState.width);
    this.y = (typeof y === 'number' ? y : Math.random() * GameState.height);
    this.collected = false;
    this.spawnTime = Date.now();
    this.vx = (Math.random() - 0.5) * 1.6;
    this.vy = (Math.random() - 0.5) * 1.6;
    this.createElement();
  }

  createElement() {
    this.element = document.createElement('div');
    this.element.className = 'ammo-particle';
    this.element.textContent = this.word;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    GameState.container.appendChild(this.element);
  }

  update(dt) {
    if (this.collected) return;
    if (Date.now() - this.spawnTime > CONFIG.AMMO_LIFETIME) { this.destroy(); return; }
    this.x += this.vx * 24 * dt;
    this.y += this.vy * 24 * dt;
    if (this.x < 0 || this.x > GameState.width) this.vx *= -1;
    if (this.y < 0 || this.y > GameState.height) this.vy *= -1;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    for (const f of GameState.fighters) {
      if (!f.alive || f.isEnemy) continue;
      if (distance(f.x, f.y, this.x, this.y) < 35) {
        f.collectAmmo(this.word);
        this.destroy();
        break;
      }
    }
  }

  destroy() {
    if (this.element) this.element.remove();
    const idx = GameState.ammo.indexOf(this);
    if (idx > -1) GameState.ammo.splice(idx, 1);
  }
}

function showFloatingText(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'damage-number';
  el.textContent = text;
  el.style.color = color;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  GameState.container.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

// ============================================================================
// SECTION 8: ASCII RULES & DISPLAY LOGIC
// ============================================================================

function distance(x1, y1, x2, y2) {
  return Math.sqrt((x2-x1) ** 2 + (y2-y1) ** 2);
}

// ============================================================================
// SECTION 9: MEMORY & CLEANUP OPTIMIZATION
// ============================================================================

function spawnPlayer(username) {
  // Check if player already has a hero alive
  const existing = GameState.fighters.find(f => f.username === username && f.alive && !f.isEnemy);
  if (existing) {
    // Can't spawn another! Just give HP boost
    existing.hp = Math.min(existing.maxHp, existing.hp + 5);
    showFloatingText(existing.x, existing.y - 30, '+5 HP', '#0f0');
    return existing;
  }
  
  // Check if player is on cooldown
  const respawnTime = GameState.playerRespawnTimes[username];
  if (respawnTime && Date.now() < respawnTime) {
    const remainingMin = Math.ceil((respawnTime - Date.now()) / 60000);
    console.log('[COOLDOWN] ' + username + ' must wait ' + remainingMin + ' more minutes');
    showFloatingText(GameState.width / 2, 200, username + ': ' + remainingMin + 'min cooldown', '#f80');
    return null;
  }
  
  // Clear cooldown and spawn new hero
  delete GameState.playerRespawnTimes[username];
  const fighter = new Fighter(username, false, false);
  GameState.fighters.push(fighter);
  showFloatingText(fighter.x, fighter.y - 50, username + ' ENTERS BATTLE!', '#0ff');
  return fighter;
}

function spawnAIEnemy() {
  const fighter = new Fighter('AI_' + Date.now(), true, false);
  GameState.fighters.push(fighter);
  return fighter;
}

function spawnAmmo(username, message, edgeSpawn = false) {
  const words = message.trim().split(/\s+/).filter(w => w.length > 0);
  for (const word of words) {
    if (word.length > 15) continue;
    let x, y;
    if (edgeSpawn) {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) {
        x = Math.random() * GameState.width;
        y = 50 + Math.random() * 100;
      } else if (side === 1) {
        x = Math.random() * GameState.width;
        y = GameState.height - 150 + Math.random() * 100;
      } else if (side === 2) {
        x = 50 + Math.random() * 100;
        y = Math.random() * GameState.height;
      } else {
        x = GameState.width - 150 + Math.random() * 100;
        y = Math.random() * GameState.height;
      }
    } else {
      x = undefined;
      y = undefined;
    }
    const ammo = new Ammo(word, x, y);
    GameState.ammo.push(ammo);
  }
}

function addChatLine(username, message) {
  GameState.chatMessages.push({ username, message, time: Date.now() });
  const retainer = document.getElementById('chat-retainer');
  const line = document.createElement('div');
  line.className = 'chat-line';
  line.textContent = username + ': ' + message.substring(0, 50);
  retainer.appendChild(line);
  while (retainer.children.length > 4) retainer.children[1].remove();
  retainer.scrollTop = retainer.scrollHeight;
}

function spawnBoss() {
  if (GameState.boss && GameState.boss.alive) return;
  const boss = new Fighter('BOSS_' + Date.now(), true, true);
  
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { boss.x = GameState.width / 2; boss.y = -30; }
  else if (side === 1) { boss.x = GameState.width / 2; boss.y = GameState.height + 30; }
  else if (side === 2) { boss.x = -30; boss.y = GameState.height / 2; }
  else { boss.x = GameState.width + 30; boss.y = GameState.height / 2; }
  
  boss.color = '#f00';
  boss.ascii = '@';
  GameState.fighters.push(boss);
  GameState.boss = boss;
  
  const enterX = Math.random() * (GameState.width - 400) + 200;
  showFloatingText(enterX, 100, '>>> BOSS INCOMING <<<', '#f00');
}

function updateKOTHZone() {
  const now = performance.now();
  if (!GameState.kothZone || now - GameState.lastKOTHMove > CONFIG.KOTH_MOVE_INTERVAL) {
    if (GameState.kothZone && GameState.kothZone.element) {
      GameState.kothZone.element.remove();
    }
    
    // Spawn away from center, in corners or edges
    let x, y;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { // Top half
      x = 150 + Math.random() * (GameState.width - 300);
      y = 100 + Math.random() * 200;
    } else if (side === 1) { // Bottom half
      x = 150 + Math.random() * (GameState.width - 300);
      y = GameState.height - 300 + Math.random() * 200;
    } else if (side === 2) { // Left side
      x = 100 + Math.random() * 200;
      y = 150 + Math.random() * (GameState.height - 300);
    } else { // Right side
      x = GameState.width - 300 + Math.random() * 200;
      y = 150 + Math.random() * (GameState.height - 300);
    }
    
    // Ensure it's not in center avoidance zone
    const distToCenter = distance(x, y, CONFIG.CENTER_AVOID_X, CONFIG.CENTER_AVOID_Y);
    if (distToCenter < CONFIG.CENTER_AVOID_RADIUS + CONFIG.KOTH_ZONE_RADIUS) {
      // Push it further away
      const dx = x - CONFIG.CENTER_AVOID_X;
      const dy = y - CONFIG.CENTER_AVOID_Y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const pushDist = CONFIG.CENTER_AVOID_RADIUS + CONFIG.KOTH_ZONE_RADIUS + 50;
      x = CONFIG.CENTER_AVOID_X + (dx / d) * pushDist;
      y = CONFIG.CENTER_AVOID_Y + (dy / d) * pushDist;
    }
    
    GameState.kothZone = { x, y };
    GameState.lastKOTHMove = now;

    const zoneEl = document.createElement('div');
    zoneEl.className = 'koth-zone';
    zoneEl.style.left = (x - CONFIG.KOTH_ZONE_RADIUS) + 'px';
    zoneEl.style.top = (y - CONFIG.KOTH_ZONE_RADIUS) + 'px';
    zoneEl.style.width = (CONFIG.KOTH_ZONE_RADIUS * 2) + 'px';
    zoneEl.style.height = (CONFIG.KOTH_ZONE_RADIUS * 2) + 'px';
    GameState.container.appendChild(zoneEl);
    GameState.kothZone.element = zoneEl;
  }

  if (GameState.kothZone) {
    for (const f of GameState.fighters) {
      if (!f.alive || f.isEnemy || isZephyr(f.username)) continue;
      const d = distance(f.x, f.y, GameState.kothZone.x, GameState.kothZone.y);
      if (d <= CONFIG.KOTH_ZONE_RADIUS) {
        const pdata = getPlayerData(f.username);
        pdata.points += CONFIG.KOTH_POINTS_PER_SEC * 0.5;
        // Show points notification occasionally
        if (Math.random() < 0.01) {
          showFloatingText(f.x, f.y - 60, '+POINTS', '#ff0');
        }
      }
    }
  }
}

function updateLeaderboard() {
  const leaderboard = document.getElementById('leaderboard');
  const players = Object.values(GameState.playerData)
    .filter(p => !isZephyr(p.username))
    .sort((a, b) => Math.floor(b.points) - Math.floor(a.points))
    .slice(0, 10);

  while (leaderboard.children.length > 1) {
    leaderboard.children[1].remove();
  }

  if (players.length === 0) {
    const emptyDiv = document.createElement('div');
    emptyDiv.className = 'leader-entry';
    emptyDiv.style.color = '#666';
    emptyDiv.textContent = 'No players yet ...';
    leaderboard.appendChild(emptyDiv);
  } else {
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const entryDiv = document.createElement('div');
      entryDiv.className = 'leader-entry';
      
      const nameSpan = document.createElement('span');
      nameSpan.className = 'leader-name';
      nameSpan.textContent = (i + 1) + '. ' + p.username.substring(0, 12);
      
      const scoreSpan = document.createElement('span');
      scoreSpan.className = 'leader-score';
      scoreSpan.textContent = 'Pts ' + Math.floor(p.points) + ' | L' + p.level;
      
      entryDiv.appendChild(nameSpan);
      entryDiv.appendChild(scoreSpan);
      leaderboard.appendChild(entryDiv);
    }
  }
}

function updateStats() {
  const players = GameState.fighters.filter(f => !f.isEnemy && f.alive).length;
  const enemies = GameState.fighters.filter(f => f.isEnemy && f.alive).length;
  const total = GameState.fighters.filter(f => f.alive).length;
  const ammo = GameState.ammo.filter(a => !a.collected).length;

  document.getElementById('player-count').textContent = players;
  document.getElementById('ai-count').textContent = enemies;
  document.getElementById('total-fighters').textContent = total;
  document.getElementById('ammo-count').textContent = ammo;
  document.getElementById('kill-count').textContent = GameState.stats.kills;
}

// ============================================================================
// SECTION 10: FINAL - INITIALIZATION & GAME LOOP
// ============================================================================

function gameLoop() {
  const now = performance.now();
  const dt = Math.min((now - GameState.lastUpdate) / 1000, 0.08);
  GameState.lastUpdate = now;

  // Update all entities
  for (const fighter of GameState.fighters.slice()) fighter.update(dt);
  for (const proj of GameState.projectiles.slice()) proj.update(dt);
  for (const ammo of GameState.ammo.slice()) ammo.update(dt);

  // Spawn AI enemies periodically
  if (now - GameState.lastAISpawn > CONFIG.AI_SPAWN_INTERVAL) {
    spawnAIEnemy();
    GameState.lastAISpawn = now;
  }

  // Check if Zephyr should respawn (every second)
  if (Math.floor(now / 1000) !== Math.floor((now - dt * 1000) / 1000)) {
    checkZephyrRespawn();
  }

  // Update KOTH zone
  updateKOTHZone();
  updateStats();

  // Update leaderboard every 2.5 seconds
  if (Math.floor(now / 2500) !== Math.floor((now - dt * 1000) / 2500)) updateLeaderboard();

  requestAnimationFrame(gameLoop);
}

  const z = new Fighter('Zephyr', false, false);
  z.x = GameState.width / 2;

  z.color = '#0ff';

  GameState.fighters.push(z);

function checkZephyrRespawn() {

    if (!GameState.zephyrRespawnTime || Date.now() >= GameState.zephyrRespawnTime) {
      spawnZephyr();
    }
  }
}
